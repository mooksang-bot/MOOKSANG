<title>제자 훈련</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: a full-bleed cover over a chosen background, then one 760px column of cards with a tab bar (bottom on phones, top on PC). */
:root{
  --bg:#f2f4f0; --card:#ffffff; --ink:#1c2925; --muted:#5d6b65; --line:#dbe2da;
  --accent:#2d6a55; --accent-ink:#ffffff; --gold:#a97b22; --soft:#e7efe9; --danger:#b4413c;
  --serif:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111714; --card:#1a231f; --ink:#e8efeb; --muted:#a2b1aa; --line:#2b3732;
  --accent:#6cc3a1; --accent-ink:#0f1a15; --gold:#e1b75e; --soft:#22302a; --danger:#f08a84; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111714; --card:#1a231f; --ink:#e8efeb; --muted:#a2b1aa; --line:#2b3732;
  --accent:#6cc3a1; --accent-ink:#0f1a15; --gold:#e1b75e; --soft:#22302a; --danger:#f08a84; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.65;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;font-size:17px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:110px;resize:vertical;line-height:1.6}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
label{display:flex;flex-direction:column;gap:6px;font-size:.92rem;color:var(--muted)}
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;min-height:46px;font-weight:500}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.88rem}

/* ---- cover ---- */
.cover{position:fixed;inset:0;display:flex;flex-direction:column;color:#fff;overflow:hidden}
.cover .bgl{position:absolute;inset:0;background-size:cover;background-position:center}
.cover .hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:38%}
.cover .dim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,calc(var(--dim)*.6)) 0%,rgba(0,0,0,var(--dim)) 100%)}
.cover .inner{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(24px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 32px) max(24px,env(safe-area-inset-left,0px))}
.eyebrow{font-size:.95rem;font-weight:700;letter-spacing:.35em;text-transform:uppercase;opacity:1}
.cover h1{font-size:clamp(2.6rem,9vw,4.6rem);letter-spacing:.06em;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.cover .sub{font-family:var(--serif);font-weight:700;font-size:clamp(1.25rem,4vw,1.7rem);opacity:1}
.cover .rule{width:56px;height:2px;background:#f3d79a}
.cover .verse{font-family:var(--serif);font-weight:700;font-size:clamp(1.9rem,6vw,2.2rem);max-width:22em;opacity:1;line-height:1.55;word-break:keep-all}
/* 표지 글씨 가독성: 글자 그림자 + 글씨 뒤 은은한 어둠 */
.cover .inner{z-index:1}
.cover .inner::before{content:"";position:absolute;inset:6% -10%;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,.42) 0%,rgba(0,0,0,.22) 45%,transparent 72%)}
.cover .eyebrow,.cover .sub,.cover .verse,.cover .hint{text-shadow:0 1px 2px rgba(0,0,0,.85),0 2px 14px rgba(0,0,0,.6)}
.cover h1{text-shadow:0 2px 4px rgba(0,0,0,.7),0 4px 28px rgba(0,0,0,.45)}
.cover .enter{margin-top:10px;background:#fff;color:#1c2925;border:0;border-radius:999px;padding:8px;line-height:1.2;font-weight:700;font-size:1.05rem;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.cover .tools{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:max(14px,env(safe-area-inset-right,0px));z-index:2}
.cover .tools button{background:rgba(0,0,0,.35);color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:8px 16px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

/* ---- modal (표지 꾸미기 창) ---- */
.modal{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.35)}
.panel{background:var(--card);color:var(--ink);width:100%;max-width:520px;max-height:88%;overflow:auto;border-radius:22px 22px 0 0;
  padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:760px){.modal{align-items:center;justify-content:flex-end;padding:24px}.panel{border-radius:22px;max-height:calc(100% - 48px)}}
.panel h2{font-size:1.35rem}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sw{aspect-ratio:3/4;border-radius:12px;border:2px solid var(--line);padding:0;position:relative;overflow:hidden;max-width:100%}
.sw span{position:absolute;left:0;right:0;bottom:0;font-size:.75rem;color:#fff;background:rgba(0,0,0,.35);padding:2px 0}
.sw.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.sw.up{background:var(--soft);display:grid;place-items:center;color:var(--accent);font-size:.8rem;line-height:1.3}
input[type=range]{padding:0;border:0;accent-color:var(--accent)}

/* ---- app shell ---- */
.shell{min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(90px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:10px}
body.app::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.head .mark{width:42px;height:42px;border-radius:12px;background-size:cover;background-position:center;flex:none;border:0;padding:0}
.head .t{flex:1;min-width:0}
.head .t h1{font-size:1.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .t p{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{font-size:.85rem;border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;white-space:nowrap;background:var(--card)}
.who.m{border-color:var(--gold);color:var(--gold)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs .in{display:flex;width:100%;max-width:760px}
.tabs button{flex:1;border:0;background:none;padding:8px 4px;border-radius:10px;font-size:.9rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--accent);font-weight:700}
@media (min-width:900px){
  .shell{padding-block:0 40px}
  .tabs{position:static;background:none;border:0;padding:0 0 4px}
  .tabs .in{gap:6px}
  .tabs button{flex:none;flex-direction:row;gap:8px;padding:8px 16px;border:1.5px solid var(--line);background:var(--card);font-size:.95rem}
  .tabs button.on{border-color:var(--accent);background:var(--soft)}
  .tabs button svg{width:18px;height:18px}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:1.25rem}
.kicker{font-size:.78rem;letter-spacing:.12em;color:var(--gold);font-weight:700}
.notice{white-space:pre-wrap;overflow-wrap:anywhere}
.bar{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.lesson{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.lesson>button.lh{width:100%;text-align:left;border:0;background:none;padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.wk{font-family:var(--serif);font-weight:700;width:48px;height:48px;border-radius:12px;background:var(--soft);color:var(--accent);display:grid;place-items:center;line-height:1.1;font-size:.8rem;text-align:center}
.wk b{font-size:1.15rem;display:block}
.lh .tt{min-width:0}
.lh .tt strong{display:block;font-family:var(--serif);font-size:1.08rem;overflow-wrap:anywhere}
.lh .tt span{font-size:.85rem;color:var(--muted)}
.chk{font-size:.8rem;border-radius:999px;padding:3px 10px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chk.ok{background:var(--accent);color:var(--accent-ink)}
.lb{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.blk{border-left:3px solid var(--gold);padding-left:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.blk .k{display:block;font-size:.8rem;color:var(--gold);font-weight:700}
.member{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.member:first-of-type{border-top:0}
.member .nm{font-weight:700}
.member .notes{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.member .notes div{background:var(--soft);border-radius:10px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{text-align:center;color:var(--muted);padding:20px 8px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:30;font-size:.92rem;max-width:calc(100% - 32px);text-align:center}
.reg{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:16px;padding-block:32px}
@media (prefers-reduced-motion:no-preference){.cover .inner>*{animation:rise .8s ease-out both}.cover .inner>*:nth-child(2){animation-delay:.08s}.cover .inner>*:nth-child(3){animation-delay:.16s}.cover .inner>*:nth-child(4){animation-delay:.24s}.cover .inner>*:nth-child(5){animation-delay:.32s}.cover .inner>*:nth-child(6){animation-delay:.4s}}
@keyframes rise{from{transform:translateY(10px);opacity:.3}to{transform:none;opacity:1}}
</style>


<style>

.mtabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.mbadge{display:inline-block;background:var(--gold);color:#fff;border-radius:8px;font-size:.75rem;font-weight:700;padding:2px 8px;letter-spacing:.05em}
.item{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.item:first-child,.kicker+.item,.kicker+h2+.item{border-top:0;padding-top:0}
#body{width:100%}
/* 마스터 창: 한 화면에 맞추기 (내용은 칸 안에서만 스크롤) */
body.mfit{height:100vh;height:100dvh;overflow:hidden}
body.mfit .shell{height:100vh;height:100dvh;box-sizing:border-box;padding-block:0 calc(10px + env(safe-area-inset-bottom,0px))}
body.mfit .shell>.wrap{height:100%;gap:8px}
body.mfit .head{position:static;padding-block:10px 4px;flex:none}

.mbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
.mbar h2{font-size:1.3rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mmenu{position:relative;display:flex;gap:6px;flex:none}
.mmenu .btn{min-height:40px;padding:6px 14px;font-size:.95rem}
.mpop{position:absolute;right:0;top:calc(100% + 6px);z-index:20;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.25);padding:6px;display:flex;flex-direction:column;min-width:190px}
.mpop button{border:0;background:none;text-align:left;padding:11px 14px;border-radius:10px;font-size:1rem}
.mpop button:hover{background:var(--soft)}
.mpop button.on{color:var(--accent);font-weight:700;background:var(--soft)}
body.mfit #body{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr);align-content:start;gap:10px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:18px}
body.mfit .card{padding:14px 16px;gap:10px}
/* 휴대폰 출석부: 칸 안 스크롤 대신 화면 전체를 손가락으로 끌어 내려 보기 */
@media (max-width:899px){
  body.mfit.lroster{height:auto;overflow:visible}

}

.book .pg,.book .face{background-color:#fffdf8;background-position:center;background-repeat:no-repeat;background-size:contain}
.book .pg{position:absolute;top:0;height:100%;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.book .pg:not(.ready):not(.blank)::before{content:"페이지를 펼치는 중…";position:absolute;inset:0;display:grid;place-items:center;color:#8a7f72;font-size:.9rem}
.book .pg.blank{background:#f4efe6}
.book.spread .pg.l::after,.book.spread .pg.r::after{content:"";position:absolute;inset:0;pointer-events:none}
.book.spread .pg.l::after{background:linear-gradient(90deg,transparent 88%,rgba(0,0,0,.16))}
.book.spread .pg.r::after{background:linear-gradient(90deg,rgba(0,0,0,.16),transparent 12%)}
.book .flip{position:absolute;top:0;height:100%;transform-style:preserve-3d;z-index:3}
.book .face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.book .face.b{transform:rotateY(180deg)}
.book .face.paper{background:#f4efe6}
.book .face::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,0) 45%);opacity:0}
.book .flip.go .face::after{animation:pshade .8s ease-in-out}
@keyframes pshade{50%{opacity:1}}
#reader .rfoot{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 16px 16px}
#reader .rfoot input[type=range]{flex:1;max-width:520px;min-width:0;accent-color:#e1b75e;background:transparent;border:0;padding:0}
#reader .rnum{font-variant-numeric:tabular-nums;min-width:76px;text-align:center;font-size:.95rem}
#reader .rnav{width:52px;height:52px;border-radius:50%;padding:0;font-size:1.6rem;line-height:1}
.cover .pastor img{width:clamp(92px,15dvh,140px);height:clamp(92px,15dvh,140px);border-radius:50%;object-fit:cover;border:3px solid #f3d79a;box-shadow:0 6px 24px rgba(0,0,0,.35);display:block}
.cover .eyebrow{color:#e9cf8c;display:flex;align-items:center;gap:14px;letter-spacing:.42em}
.cover .eyebrow::before,.cover .eyebrow::after{content:"";width:34px;height:1px;background:linear-gradient(90deg,transparent,#e9cf8c)}
.cover .eyebrow::after{background:linear-gradient(90deg,#e9cf8c,transparent)}
.cover h1{color:#f3d68e;background:linear-gradient(180deg,#fff8de 0%,#f4da93 34%,#cf9f45 58%,#f8e6b0 82%,#d9ad58 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.65)) drop-shadow(0 8px 26px rgba(0,0,0,.45))}
.cover .rule{width:150px;height:14px;background:none;position:relative;display:flex;align-items:center;justify-content:center}
.cover .rule::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:linear-gradient(90deg,transparent,#e9cf8c 30%,#e9cf8c 70%,transparent)}
.cover .rule::after{content:"";width:9px;height:9px;transform:rotate(45deg);background:linear-gradient(135deg,#fff3c8,#c99a3f);box-shadow:0 0 0 3px rgba(20,14,6,.55)}
.cover.lit .rule{box-shadow:none;filter:drop-shadow(0 0 8px #f3d79a)}
.cover .pastor img{border:3px solid transparent;background:linear-gradient(#000,#000) padding-box,linear-gradient(135deg,#fff1c2,#c99a3f,#f6e2a8) border-box}
.cover .sub{color:#fbf2df;letter-spacing:.04em}
.cover .verse .q{color:#f6ead2}
.cover .verse .ref{color:#e3c47c;font-size:1em;letter-spacing:.06em;font-weight:700}
.cover .enter{background:linear-gradient(180deg,#f8e3a8,#d8a94e);color:#2a1d08;border:1px solid #fff0c4;letter-spacing:.08em;box-shadow:0 8px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.6)}
@media (max-height:720px){.cover .inner{gap:10px}.cover h1{font-size:clamp(2.2rem,8vw,3.2rem)}.cover .pastor img{width:80px;height:80px}.cover .verse{font-size:clamp(1.6rem,5.4vw,2rem)}}
.pphoto{width:110px;height:110px;flex:none;border-radius:50%;overflow:hidden;background:var(--soft);display:grid;place-items:center;text-align:center;color:var(--muted);font-size:.85rem;border:3px solid var(--gold)}
.pphoto img{width:100%;height:100%;object-fit:cover}
</style>
<div id="root"></div>

<script>
/* ================= 기본값 ================= */
const PRESETS={
  dawn:{name:'새벽',css:'linear-gradient(165deg,#1d3557 0%,#6d4a6b 45%,#d9825b 76%,#f4c27a 100%)',hill:'#22303f'},
  field:{name:'들판',css:'linear-gradient(170deg,#23413a 0%,#4f7d5c 48%,#a9c27f 80%,#ead9a0 100%)',hill:'#1e3a2f'},
  sea:{name:'바다',css:'linear-gradient(170deg,#0d2b45 0%,#1f5f7a 50%,#4fa3a5 80%,#cfe8df 100%)',hill:'#0f2a3a'},
  night:{name:'밤하늘',css:'linear-gradient(175deg,#070b1f 0%,#1c2450 55%,#4a3f74 85%,#8a6a8f 100%)',hill:'#0a0d1f'}
};
const DEF_COVER={bg:{type:'preset',value:'dawn'},dim:25,title:'제자 훈련',sub:'인도 · 김병구 목사',verse:'“그러므로 너희는 가서 모든 민족을 제자로 삼아”\n— 마태복음 28:19'};
const LSK='disciple-v2',LUN='disciple-unlocked',LSEEN='disciple-seen';
let db=null,assets=null;
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const LMS='disciple-master-ok',LLD='disciple-leader-ok';
const ssGet=k=>{try{return sessionStorage.getItem(k)}catch(e){return null}};
const ssSet=(k,v)=>{try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}};
const st={mode:'loading',master:false,uid:null,cover:{...DEF_COVER},notices:[],lessons:[],materials:[],members:{},progAll:{},
  me:null,meLoaded:false,prog:{done:{},notes:{}},pwHash:null,unlocked:ssGet(LUN),seen:+(lsGet(LSEEN)||0),
  masterHash:null,masterLoaded:false,masterOk:ssGet(LMS),mpwOpen:false,mpwMsg:'',
  memos:[],menuOpen:false,
  leaderHash:null,leaderOk:ssGet(LLD),lpwOpen:false,lpwMsg:'',lpwWrong:0,lpwWait:0,ltab:'att',lmonth:'',roster:[],att:{},lmemos:[],lDraft:{id:null,text:'',locked:false},lNote:'',rEdit:null,
  view:'cover',tab:'home',mtab:'memo',open:null,editing:null,draft:null,busy:false,pwOpen:false,pwMsg:'',pwWrong:0,pwWait:0,allNotices:false,matKind:'file'};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const uidGen=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtDate=t=>t?new Date(t).toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'}):'';
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function bgCss(c){const b=c.bg||{};if(b.type==='asset')return `url("/_blob/${b.value}")`;if(b.type==='data')return `url("${b.value}")`;return (PRESETS[b.value]||PRESETS.dawn).css}
const hillSvg=c=>{const b=c.bg||{};if(b.type!=='preset')return '';const h=(PRESETS[b.value]||PRESETS.dawn).hill;
  return `<svg class="hills" viewBox="0 0 1200 300" preserveAspectRatio="none" aria-hidden="true"><path d="M0 190 C180 120 330 150 470 175 C640 205 760 110 930 120 C1050 128 1130 160 1200 150 L1200 300 L0 300Z" fill="${h}" opacity=".55"/><path d="M0 240 C220 190 380 230 560 225 C760 220 900 175 1200 215 L1200 300 L0 300Z" fill="${h}" opacity=".85"/></svg>`};
const LOCALURLS={};
const assetUrl=(m,i=0)=>{const lu=m.localUrls||LOCALURLS[m.id];if(lu)return lu[i]||lu[0];return '/_blob/'+((m.pages&&m.pages[i])||m.assetId)};
const bookable=m=>!!m&&m.kind==='file'&&(/pdf/.test(m.contentType||'')||/^image\//.test(m.contentType||''));
const safeLink=u=>/^https?:\/\//i.test(u)?u:'https://'+u;

/* ================= 저장 ================= */
const isLocal=()=>st.mode==='local';
function lsLoad(){try{const d=JSON.parse(lsGet(LSK)||'null');if(d)Object.assign(st,{roster:(d.roster||[]).slice(),att:d.att||{},lmemos:d.lmemos||[],leaderHash:d.leaderHash||null,cover:{...DEF_COVER,...d.cover},notices:d.notices||[],lessons:d.lessons||[],materials:d.materials||[],prog:d.prog||{done:{},notes:{}},pwHash:d.pwHash||null,masterHash:d.masterHash||null,memos:d.memos||[],guideText:d.guideText||''})}catch(e){}}
function lsSave(){lsSet(LSK,JSON.stringify({roster:st.roster,att:st.att,lmemos:st.lmemos,leaderHash:st.leaderHash,cover:st.cover,notices:st.notices,lessons:st.lessons,materials:st.materials,prog:st.prog,pwHash:st.pwHash,masterHash:st.masterHash,memos:st.memos,guideText:st.guideText||''}))}
async function write(fn,okMsg){if(isLocal()){lsSave();if(okMsg)toast(okMsg);return true}
  try{await fn();if(okMsg)toast(okMsg);return true}catch(e){toast(e&&e.code==='invalid_argument'?'저장할 권한이 없어요. 목사님께 “참여자” 권한을 요청해 주세요.':'저장하지 못했어요. 잠시 뒤 다시 해 주세요.');return false}}
const plain=o=>JSON.parse(JSON.stringify(o));
const upsert=(arr,o)=>{const i=arr.findIndex(x=>x.id===o.id);if(i>=0)arr[i]=o;else arr.push(o)};
function body(o){const {id,...b}=o;return plain(b)}
const saveCover=c=>{st.cover=c;return write(()=>db.collection('board').doc('cover').set(plain(c)),'표지를 저장했어요. 모든 성도님께 보여요.')};
const saveGuideText=t=>{st.guideText=t;return write(()=>db.collection('board').doc('guide').set({text:t,updatedAt:Date.now()}),'지침서 내용을 저장했어요. 제자들에게 바로 보여요.')};
const saveNoticeDoc=n=>{upsert(st.notices,n);sortAll();return write(()=>db.collection('notices').doc(n.id).set(body(n)),'제자들에게 보냈어요.')};
const saveMemo=m=>{upsert(st.memos,m);sortAll();return write(()=>db.collection('memos').doc(m.id).set(body(m)),'메모를 저장했어요.')};
const delMemo=id=>{st.memos=st.memos.filter(x=>x.id!==id);return write(()=>db.collection('memos').doc(id).delete(),'메모를 삭제했어요.')};
const delNotice=id=>{st.notices=st.notices.filter(x=>x.id!==id);return write(()=>db.collection('notices').doc(id).delete(),'공지를 지웠어요.')};
const saveLesson=l=>{upsert(st.lessons,l);sortAll();return write(()=>db.collection('lessons').doc(l.id).set(body(l)),'과정을 저장했어요.')};
const delLesson=id=>{st.lessons=st.lessons.filter(x=>x.id!==id);return write(()=>db.collection('lessons').doc(id).delete(),'과정을 지웠어요.')};
const saveMat=m=>{upsert(st.materials,m);sortAll();return write(()=>db.collection('materials').doc(m.id).set(body(m)),'자료를 올렸어요.')};
async function delMat(m){st.materials=st.materials.filter(x=>x.id!==m.id);const ok=await write(()=>db.collection('materials').doc(m.id).delete(),'자료를 지웠어요.');
  if(ok&&m.assetId&&assets)assets.delete(m.assetId).catch(()=>{});return ok}
const saveProg=()=>write(()=>db.collection('progress').doc(st.uid).set(plain(st.prog)));
async function saveMe(m){const ok=await write(()=>db.collection('members').doc(st.uid).set(m),'등록했어요. 환영합니다!');if(ok)st.me=m;return ok}
async function hashPw(pw){const t='disciple:'+pw;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(const c of t)h=((h*33)^c.charCodeAt(0))>>>0;return 'h'+h.toString(16)}}
async function savePw(pw){const h=pw?await hashPw(pw):null;st.pwHash=h;
  return write(()=>db.collection('settings').doc('entry').set({hash:h,updatedAt:Date.now()}),h?'입장 비밀번호를 정했어요.':'비밀번호를 껐어요.')}
async function saveMasterPw(pw){const h=await hashPw('master:'+pw);st.masterHash=h;st.masterOk=h;ssSet(LMS,h);
  return write(()=>db.collection('settings').doc('master').set({hash:h,updatedAt:Date.now()}),'마스터 비밀번호를 정했어요.')}
const masterUnlocked=()=>st.master&&!!st.masterHash&&st.masterOk===st.masterHash;
function openMaster(){if(!st.master){toast('마스터 창은 목사님(편집자)만 열 수 있어요.');return}
  st.masterOk=null;ssSet(LMS,null);st.mpwOpen=true;st.mpwMsg='';st.view='cover';render();const i=$('#mp1');if(i)i.focus()}
function lockMaster(){st.masterOk=null;ssSet(LMS,null);go('cover');toast('마스터 창을 잠갔어요.')}
const pastorSrc=c=>{const p=c.pastor;if(!p||!p.value)return '';return p.type==='asset'?'/_blob/'+p.value:p.value};
function sortAll(){st.lessons.sort((a,b)=>(+a.week||0)-(+b.week||0)||(a.createdAt||0)-(b.createdAt||0));
  st.notices.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(b.createdAt||0)-(a.createdAt||0));
  st.memos.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(b.createdAt||0)-(a.createdAt||0));
  st.materials.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))}

/* ================= 화면 공통 ================= */
const root=document.getElementById('root');
const typing=()=>{const a=document.activeElement;return a&&root.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)};
function soft(){if(!typing())render()}
const entryOk=()=>!!st.pwHash&&st.unlocked===st.pwHash;
const canEnter=()=>entryOk()||masterUnlocked();
const needReg=()=>st.mode==='db'&&!st.master&&st.meLoaded&&!st.me;
/* 마스터(편집자)라도 '제자들 입장'으로 들어오면 제자와 똑같은 화면만 보여요 */
const isM=()=>!!st.master&&st.view!=='app';
function go(view){st.view=view;window.scrollTo(0,0);render()}
function render(){document.body.classList.toggle('app',st.view!=='cover');document.body.classList.remove('lroster');
  if(st.view==='master'&&!masterUnlocked())st.view='cover';
  if(st.view==='app'&&!canEnter())st.view='cover';
  if(st.view==='leader'&&!leaderUnlocked())st.view='cover';
  document.body.classList.toggle('mfit',st.view==='master');
  if(st.view==='cover')return coverView();
  if(st.view==='master')return masterView();
  if(st.view==='leader')return leaderView();
  if(needReg())return regView();
  appView()}
const on=(sel,f)=>{const e=$(sel);if(e)e.onclick=f};

/* ---- 표지 ---- */
function verseHtml(v){return String(v||'').split('\n').map(l=>/^\s*[—–-]/.test(l)?`<span class="ref">${esc(l.trim())}</span>`:`<span class="q">${esc(l)}</span>`).join('<br>')}
function coverView(){const c=st.draft||st.cover;
  root.innerHTML=`<section class="cover" style="--dim:${(c.dim??25)/100}">
   <div class="bgl" style='background:${bgCss(c)};background-size:cover;background-position:center'></div>${hillSvg(c)}<div class="dim"></div><div class="glow" aria-hidden="true"></div>
   <div class="inner">
     <p class="eyebrow">Discipleship</p>
     <h1>${esc(c.title)}</h1>
     <div class="rule"></div>
     ${pastorSrc(c)?`<div class="pastor"><img src="${esc(pastorSrc(c))}" alt="담당 목사님 사진"></div>`:''}
     <p class="sub">${esc(c.sub)}</p>
     <p class="verse">${verseHtml(c.verse)}</p>
     ${st.draft?'':`<div class="enters">${st.master?`<button class="enter alt" id="toMaster">마스터 입장</button>`:''}<button class="enter" id="enter">${st.mode==='loading'?'준비 중…':'제자들 입장'}</button><button class="enter lead" id="toLeader">${leaderUnlocked()?'반장 창':'반장 입장'}</button></div>`}
     ${st.master&&!st.draft&&!st.pwHash&&st.mode!=='loading'?`<p class="hint">입장 비밀번호가 아직 없어요. 마스터 창 › 다른 기능 › 설정에서 정해 주세요.</p>`:''}
   </div></section>${st.draft?decorPanel():''}${st.pwOpen?pwPanel():''}${st.mpwOpen?mpwPanel():''}${st.lpwOpen?lpwPanel():''}`;
  on('#enter',()=>{if(st.mode==='loading')return;st.unlocked=null;ssSet(LUN,null);st.pwOpen=true;st.pwMsg='';render();const i=$('#pwIn');if(i)i.focus()});
  on('#toMaster',openMaster);
  on('#toLeader',openLeader);
  if(st.draft)bindDecor();if(st.pwOpen)bindPw();if(st.mpwOpen)bindMpw();if(st.lpwOpen)bindLpw()}
function mpwPanel(){const create=st.masterLoaded&&!st.masterHash;
  return `<div class="modal" id="mpModal"><div class="panel" role="dialog" aria-label="마스터 입장" style="max-width:420px">
   <div class="row" style="justify-content:space-between"><h2>${!st.masterLoaded?'잠시만요':create?'마스터 비밀번호 만들기':'마스터 입장'}</h2><button class="btn ghost" id="mpClose">닫기</button></div>
   ${!st.masterLoaded?'<p class="muted">마스터 정보를 불러오고 있어요…</p>'
   :`<p class="muted">${create?'마스터 창을 열 때 쓸 비밀번호를 정해 주세요. 성도님 입장 비밀번호와 다르게 정해 주세요.':'마스터 비밀번호를 입력해 주세요. 앱을 닫았다 열면 다시 물어봐요.'}</p>
     <input id="mp1" class="pwin" type="password" autocomplete="${create?'new-password':'current-password'}" maxlength="20" aria-label="마스터 비밀번호">
     ${create?'<input id="mp2" class="pwin" type="password" autocomplete="new-password" maxlength="20" aria-label="한 번 더 입력" placeholder="한 번 더">':''}
     <p class="perr" aria-live="polite">${esc(st.mpwMsg)}</p>
     <button class="btn pri" id="mpGo">${create?'정하고 마스터 창 열기':'마스터 창 열기'}</button>`}</div></div>`}
function bindMpw(){const close=()=>{st.mpwOpen=false;render()};on('#mpClose',close);$('#mpModal').onclick=e=>{if(e.target.id==='mpModal')close()};
  const go2=async()=>{const a=$('#mp1').value.trim();
    if(!st.masterHash){const b=$('#mp2').value.trim();if(a.length<4){st.mpwMsg='4자 이상 적어 주세요.';return render()}if(a!==b){st.mpwMsg='두 비밀번호가 달라요.';return render()}
      await saveMasterPw(a);st.mpwOpen=false;return go('master')}
    if(Date.now()<st.pwWait){st.mpwMsg='잠시 뒤에 다시 해 주세요.';return render()}
    const h=await hashPw('master:'+a);
    if(h===st.masterHash){st.masterOk=h;ssSet(LMS,h);st.mpwOpen=false;st.pwWrong=0;go('master')}
    else{st.pwWrong++;if(st.pwWrong>=5){st.pwWait=Date.now()+30000;st.pwWrong=0;st.mpwMsg='5번 틀렸어요. 30초 뒤에 다시 해 주세요.'}else st.mpwMsg='비밀번호가 맞지 않아요.';render();const i=$('#mp1');if(i)i.focus()}};
  on('#mpGo',go2);['#mp1','#mp2'].forEach(id=>{const i=$(id);if(i)i.onkeydown=e=>{if(e.key==='Enter')go2()}})}
function pwPanel(){const none=!st.pwHash;
  return `<div class="modal" id="pwModal"><div class="panel" role="dialog" aria-label="입장 비밀번호" style="max-width:420px">
   <div class="row" style="justify-content:space-between"><h2>${none?'아직 입장할 수 없어요':'입장 비밀번호'}</h2><button class="btn ghost" id="pwClose">닫기</button></div>
   ${none?`<p>${st.master?'아직 입장 비밀번호를 정하지 않았어요. “마스터 입장” › 다른 기능 › 설정에서 비밀번호를 정해 주세요.':'김병구 목사님이 입장 비밀번호를 정하면 들어올 수 있어요. 비밀번호는 목사님께 받아 주세요.'}</p>`
   :`<p class="muted">마스터(김병구 목사님)가 알려 준 비밀번호를 입력하고 입장해 주세요.</p>

  const {sp,pw,ph}=geom();if(sp)RD.p-=RD.p%2;const step=sp?2:1;
  const num=sp&&RD.p+2<=RD.n?`${RD.p+1}–${RD.p+2}`:`${RD.p+1}`;
  el.innerHTML=`<div class="rbar"><h2>${esc(RD.m.title)}</h2>${document.fullscreenEnabled?`<button class="rbtn" id="rFull">${document.fullscreenElement?'전체 화면 끄기':'전체 화면'}</button>`:''}<button class="rbtn" id="rClose">닫기</button></div>
   <div class="rstage" id="rStage"><div class="book ${sp?'spread':''}" id="rBook" style="width:${sp?pw*2:pw}px;height:${ph}px">
    ${sp?`<div class="pg l" style="left:0;width:${pw}px"></div><div class="pg r" style="left:${pw}px;width:${pw}px"></div>`:`<div class="pg s" style="left:0;width:${pw}px"></div>`}
   </div></div>
   <div class="rfoot"><button class="rbtn rnav" id="rPrev" aria-label="앞 페이지" ${RD.p<=0?'disabled':''}>‹</button>
    <input type="range" id="rSlide" min="1" max="${RD.n}" value="${RD.p+1}" aria-label="페이지 이동" ${RD.n<2?'disabled':''}>
    <span class="rnum">${num} / ${RD.n}</span>
    <button class="rbtn rnav" id="rNext" aria-label="다음 페이지" ${RD.p+step>=RD.n?'disabled':''}>›</button></div>`;
  if(sp){paint(el.querySelector('.pg.l'),RD.p);paint(el.querySelector('.pg.r'),RD.p+1)}else paint(el.querySelector('.pg.s'),RD.p);
  for(let k=0;k<3;k++)pageSrc(RD.p+step+k);
  lsSet('disciple-page-'+RD.m.id,String(RD.p));
  $('#rClose').onclick=closeReader;$('#rPrev').onclick=()=>flip(-1);$('#rNext').onclick=()=>flip(1);
  const fb=$('#rFull');if(fb)fb.onclick=()=>{(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()).then(()=>setTimeout(drawReader,150)).catch(()=>{})};
  const sl=$('#rSlide');sl.oninput=()=>{el.querySelector('.rnum').textContent=`${sl.value} / ${RD.n}`};sl.onchange=()=>{RD.p=+sl.value-1;drawReader()};
  const stg=$('#rStage');let sx=0,sy=0;
  stg.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;RD.swiped=false};
  stg.ontouchend=e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){RD.swiped=true;flip(dx<0?1:-1)}};
  stg.onclick=e=>{if(RD.swiped){RD.swiped=false;return}const b=$('#rBook').getBoundingClientRect();if(e.clientY<b.top||e.clientY>b.bottom)return;flip(e.clientX<b.left+b.width/2?-1:1)}}
async function flip(dir){if(RD.anim||!RD.m||RD.err)return;const {sp,pw}=geom();const step=sp?2:1;const np=RD.p+dir*step;if(np<0||np>=RD.n)return;
  const book=$('#rBook');if(!book)return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){RD.p=np;return drawReader()}
  RD.anim=true;let front,back=null,left=0,origin='left',from=0,to=-180,base=null,baseI=null;
  if(!sp){if(dir>0){front=RD.p;base=book.querySelector('.pg.s');baseI=np}else{front=np;from=-180;to=0}}
  else if(dir>0){front=RD.p+1;back=np;left=pw;base=book.querySelector('.pg.r');baseI=np+1}
  else{front=RD.p;back=np+1;origin='right';to=180;base=book.querySelector('.pg.l');baseI=np}
  await Promise.all([front,back,baseI].map(i=>pageSrc(i))).catch(()=>{});
  if(!RD.anim)return;
  if(base)await paint(base,baseI);
  const f=document.createElement('div');f.className='flip';
  f.style.cssText=`left:${left}px;width:${pw}px;transform-origin:${origin} center;transform:rotateY(${from}deg)`;
  f.innerHTML=`<div class="face f"></div><div class="face b ${back==null?'paper':''}"></div>`;
  await paint(f.querySelector('.f'),front);if(back!=null)await paint(f.querySelector('.b'),back);
  book.appendChild(f);f.getBoundingClientRect();
  f.style.transition='transform .8s cubic-bezier(.35,.1,.25,1)';f.classList.add('go');f.style.transform=`rotateY(${to}deg)`;
  let fin=false;const done=()=>{if(fin)return;fin=true;RD.anim=false;RD.p=np;drawReader()};
  f.addEventListener('transitionend',done,{once:true});setTimeout(done,1100)}
document.addEventListener('keydown',e=>{if(!RD.m)return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();flip(1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();flip(-1)}else if(e.key==='Escape'&&!document.fullscreenElement)closeReader()});
let rzT;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(RD.m&&!RD.anim)drawReader()},150)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-read]');if(!b)return;e.preventDefault();openReader(st.materials.find(x=>x.id===b.dataset.read))});

/* ================= 네온 빛 ================= */
const NEON={pts:[],raf:0,cv:null,ctx:null};
function neonOn(){return st.view==='cover'&&!st.draft&&!st.pwOpen&&!st.mpwOpen&&!RD.m}
function neonInit(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=document.createElement('canvas');cv.id='neonCv';cv.setAttribute('aria-hidden','true');document.body.appendChild(cv);NEON.cv=cv;NEON.ctx=cv.getContext('2d');
  const size=()=>{const d=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*d;cv.height=innerHeight*d;NEON.ctx.setTransform(d,0,0,d,0,0)};size();addEventListener('resize',size);
  addEventListener('pointermove',e=>{if(!neonOn())return;const now=performance.now();NEON.pts.push({x:e.clientX,y:e.clientY,t:now});if(NEON.pts.length>80)NEON.pts.shift();
    const c=$('.cover');if(c){c.style.setProperty('--mx',e.clientX+'px');c.style.setProperty('--my',e.clientY+'px');c.classList.add('lit')}
    if(!NEON.raf)NEON.raf=requestAnimationFrame(neonDraw)},{passive:true})}
function neonDraw(now){const {ctx,pts}=NEON;ctx.clearRect(0,0,innerWidth,innerHeight);const life=600;
  while(pts.length&&now-pts[0].t>life)pts.shift();
  if(!neonOn())pts.length=0;
  ctx.lineCap='round';ctx.lineJoin='round';
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],k=Math.max(0,1-(now-b.t)/life),hue=175+(i/pts.length)*110;
    ctx.strokeStyle=`hsla(${hue},100%,68%,${k})`;ctx.shadowColor=`hsla(${hue},100%,60%,1)`;ctx.shadowBlur=22*k;ctx.lineWidth=1.5+6*k;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
  const last=pts[pts.length-1];
  if(last){const k=Math.max(0,1-(now-last.t)/life);ctx.shadowBlur=26*k;ctx.shadowColor='#5ff5e6';ctx.fillStyle=`rgba(230,255,252,${k})`;ctx.beginPath();ctx.arc(last.x,last.y,3.5+2*k,0,Math.PI*2);ctx.fill()}
  if(pts.length)NEON.raf=requestAnimationFrame(neonDraw);else{NEON.raf=0;ctx.clearRect(0,0,innerWidth,innerHeight);const c=$('.cover');if(c)c.classList.remove('lit')}}
neonInit();

/* ================= 시작 ================= */
lsLoad();sortAll();sortRoster();render();
(async()=>{await new Promise(r=>setTimeout(r,0));
  let d=null,u=null;
  try{if(window.claude){[d,u,assets]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('assets')])}}catch(e){}
  if(!d){st.mode='local';st.master=true;st.meLoaded=true;st.masterLoaded=true;render();return}
  db=d;st.mode='db';st.notices=[];st.lessons=[];st.materials=[];st.pwHash=null;st.masterHash=null;
  try{st.uid=u?await u.id():null;st.master=u?!!(await u.canEdit()):false}catch(e){}
  if(!st.uid)st.meLoaded=true;
  const timer=setTimeout(()=>{st.meLoaded=true;soft()},8000);
  const col=(name,key)=>db.collection(name).onSnapshot(q=>{st[key]=q.docs.map(x=>({id:x.id,...x.data()}));sortAll();soft()},()=>{});
  db.collection('board').doc('guide').onSnapshot(s=>{st.guideText=s.exists?String(s.data().text||''):'';soft()},()=>{});
  db.collection('board').doc('cover').onSnapshot(s=>{st.cover=s.exists?{...DEF_COVER,...s.data()}:{...DEF_COVER};soft()},()=>{});
  db.collection('settings').doc('entry').onSnapshot(s=>{st.pwHash=s.exists?(s.data().hash||null):null;soft()},()=>{});
  st.leaderHash=null;db.collection('settings').doc('leader').onSnapshot(s=>{st.leaderHash=s.exists?(s.data().hash||null):null;soft()},()=>{});
  col('notices','notices');col('lessons','lessons');col('materials','materials');
  if(st.uid){
    db.collection('members').doc(st.uid).onSnapshot(s=>{st.me=s.exists?s.data():null;st.meLoaded=true;clearTimeout(timer);soft()},()=>{st.meLoaded=true;soft()});
    db.collection('progress').doc(st.uid).onSnapshot(s=>{if(s.exists&&!s.metadata.hasPendingWrites){const p=s.data();st.prog={done:{...(p.done||{})},notes:{...(p.notes||{})}}}soft()},()=>{});
  }
  if(st.master){
    col('memos','memos');
    db.collection('leaderMemos').onSnapshot(q=>{st.lmemos=q.docs.map(x=>({id:x.id,...plain(x.data())})).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));soft()},()=>{});
    db.collection('settings').doc('master').onSnapshot(s=>{st.masterHash=s.exists?(s.data().hash||null):null;st.masterLoaded=true;soft()},()=>{st.masterLoaded=true;soft()});
    db.collection('members').onSnapshot(q=>{st.members=Object.fromEntries(q.docs.map(x=>[x.id,x.data()]));soft()},()=>{});
    db.collection('progress').onSnapshot(q=>{st.progAll=Object.fromEntries(q.docs.map(x=>[x.id,x.data()]));soft()},()=>{});
  }
  render()})();
</script>
