<title>엘리사 수학 교실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one centered column (max 720px) of big touch targets over an anime-style sky; views swap in place. */
:root{
  --sky1:#bfe6ff; --sky2:#ffe3ef; --ink:#2b2350; --muted:#625b86; --card:#ffffff; --card2:#f6f3ff;
  --line:#e2dcf5; --pri:#ff6f4f; --pri-ink:#ffffff; --mint:#22a88a; --sun:#ffc23c; --violet:#6c55e0;
  --good:#16865c; --good-bg:#dcf6ea; --bad:#d23c43; --bad-bg:#ffe4e4; --cloud:#ffffffd9;
  --display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky1:#17183d; --sky2:#3a2148; --ink:#f4f1ff; --muted:#bdb5e3; --card:#25224a; --card2:#2e2a58;
  --line:#403a72; --pri:#ff8566; --pri-ink:#1b1238; --mint:#4fd3b0; --sun:#ffd166; --violet:#a796ff;
  --good:#5fe0a6; --good-bg:#173d33; --bad:#ff7b80; --bad-bg:#4a1f2b; --cloud:#ffffff22; color-scheme:dark}}
:root[data-theme="dark"]{
  --sky1:#17183d; --sky2:#3a2148; --ink:#f4f1ff; --muted:#bdb5e3; --card:#25224a; --card2:#2e2a58;
  --line:#403a72; --pri:#ff8566; --pri-ink:#1b1238; --mint:#4fd3b0; --sun:#ffd166; --violet:#a796ff;
  --good:#5fe0a6; --good-bg:#173d33; --bad:#ff7b80; --bad-bg:#4a1f2b; --cloud:#ffffff22; color-scheme:dark}

*{box-sizing:border-box}
body{background:linear-gradient(180deg,var(--sky1),var(--sky2)) fixed;background-color:var(--sky1);color:var(--ink);
  font-family:var(--body);font-size:18px;line-height:1.6;min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px;position:relative}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:2.1rem} h2{font-size:1.6rem} h3{font-size:1.25rem}
p{margin:0}
button{font-family:var(--display);font-size:1.1rem;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
a{color:var(--violet)}
.muted{color:var(--muted)}
.clouds{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.clouds span{position:absolute;background:var(--cloud);border-radius:999px;filter:blur(1px);animation:drift 40s linear infinite}
.clouds span::before,.clouds span::after{content:"";position:absolute;background:inherit;border-radius:50%}
.clouds span::before{width:55%;height:160%;left:15%;bottom:20%}
.clouds span::after{width:40%;height:130%;right:12%;bottom:25%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.wrap>*{position:relative;z-index:1}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chips{display:inline-flex;gap:6px;align-items:center}
.resetbtn{cursor:pointer;color:var(--bad);border-color:var(--bad)}
.resetbtn:hover{background:var(--bad-bg)}
.rmodal{position:fixed;inset:0;z-index:70;background:#00000059;display:grid;place-items:center;padding:16px}
.rbox{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:20px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:10px;text-align:center}
.rbox .btn{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-family:var(--display);font-size:1rem;white-space:nowrap}
.chip b{font-weight:400;color:var(--pri)}
.back{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 16px}

/* hero */
.hero{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;background:var(--card);border:3px solid var(--line);border-radius:28px;padding:18px}
.hero>div{min-width:0}
.mascot{width:150px;height:150px;animation:bob 3.2s ease-in-out infinite}
.avatar{position:relative;width:150px;height:150px;flex:none}
.avatar .mascot{width:100%;height:100%}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:5px solid var(--sun);display:block;animation:bob 3.2s ease-in-out infinite}
.cam{position:absolute;right:0;bottom:0;width:38px;height:38px;border-radius:50%;padding:0;display:grid;place-items:center;background:var(--violet);color:#fff;border:3px solid var(--card)}
.lockcard{align-items:center;text-align:center;justify-content:center;max-width:420px;width:100%;margin:0 auto}
.lockcard .avatar{width:clamp(72px,16dvh,140px);height:clamp(72px,16dvh,140px)}
.pins{display:flex;gap:12px;justify-content:center;min-height:22px}
.pins i{width:18px;height:18px;border-radius:50%;border:3px solid var(--violet)}
.pins i.on{background:var(--violet)}
.pins.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.perr{color:var(--bad);min-height:1.5em;font-size:.95rem}
.pad.pinpad{grid-template-columns:repeat(3,1fr);width:100%}
.pad.pinpad button.go{grid-column:auto}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
.bubble{background:var(--card2);border-radius:20px;padding:12px 16px;margin-top:8px;position:relative;font-size:1.05rem}
.hero h1 span{color:var(--pri)}
@media (max-width:520px){.hero{grid-template-columns:1fr;text-align:center;justify-items:center}.mascot,.avatar{width:120px;height:120px}h1{font-size:1.8rem}}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--card);border:3px solid var(--line);border-radius:24px;padding:16px;min-height:150px;transition:transform .15s,border-color .15s;position:relative}
.tile:hover{transform:translateY(-3px);border-color:var(--violet)}
.tile:active{transform:scale(.98)}
.tile .ic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center}
.tile .t{font-family:var(--display);font-size:1.35rem}
.tile .d{font-family:var(--body);font-size:.95rem;color:var(--muted);line-height:1.4}
.tile.big{grid-column:1/-1;flex-direction:row;align-items:center;gap:16px;min-height:120px;background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.tile.big .d{color:var(--pri-ink);opacity:.9}
.tile.big .ic{background:#ffffff33;width:72px;height:72px;flex:none}
.badge{position:absolute;top:10px;right:12px;background:var(--bad);color:#fff;border-radius:999px;min-width:30px;height:30px;padding:0 8px;display:grid;place-items:center;font-family:var(--display);font-size:1rem}
@media (max-width:420px){.tiles{grid-template-columns:1fr}.tile{min-height:0}}

/* journey path */
.card{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px}
.path{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:.85rem;border:2px solid var(--line);background:var(--card2);color:var(--muted)}
.dot.ok{background:var(--sun);border-color:var(--sun);color:#3b2a00}
.dot.now{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--pri) 50%,transparent)}50%{box-shadow:0 0 0 8px transparent}}
.gsep{width:2px;height:30px;background:var(--line);margin:0 4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}

/* problem */
.qcard{background:var(--card);border:3px solid var(--line);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-family:var(--display);font-size:.95rem;background:var(--card2);border-radius:999px;padding:3px 12px;color:var(--violet)}
.tag.rev{background:var(--bad-bg);color:var(--bad)}
.q{font-family:var(--display);font-size:1.7rem;line-height:1.7;overflow-wrap:anywhere}
.q small{display:block;font-family:var(--body);font-size:1rem;color:var(--muted)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.1;margin:0 3px;font-size:.85em}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 4px}
.rt{border-top:2px solid currentColor;padding:0 2px;margin-left:1px}
sup{font-size:.6em}
.ansbox{font-family:var(--display);font-size:2rem;min-height:64px;border:3px dashed var(--line);border-radius:18px;display:flex;align-items:center;justify-content:center;padding:6px 12px;background:var(--card2);font-variant-numeric:tabular-nums}
.ansbox.empty{color:var(--muted);font-size:1.1rem}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pad button{min-height:58px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-size:1.5rem}
.pad button.op{background:var(--card2)}
.pad button.go{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);grid-column:span 2}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices button{min-height:70px;border-radius:18px;border:3px solid var(--line);background:var(--card);font-size:1.3rem;padding:10px;text-align:center;line-height:1.5}
.choices button.pick{border-color:var(--violet);background:var(--card2)}
.choices button.right{border-color:var(--good);background:var(--good-bg)}
.choices button.wrong{border-color:var(--bad);background:var(--bad-bg)}
@media (max-width:480px){.choices{grid-template-columns:1fr}.q{font-size:1.45rem}}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border-radius:16px;border:3px solid var(--line);background:var(--card);padding:12px 18px;min-height:54px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.ghost{background:transparent}
.btn.grow{flex:1}

.fb{border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;animation:pop .3s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:none;opacity:1}}
.qcard{position:relative}
[hidden]{display:none!important}
body.fit .qcard{overflow-y:auto;overscroll-behavior:contain}
.inlfb{display:flex;flex-direction:column;gap:10px}
.inlfb>.fb{animation:pop .3s ease-out}
.workbox{display:flex;flex-direction:column;gap:6px}
.workbox label{font-family:var(--display);font-size:1rem}
.workbox textarea,.review textarea{width:100%;font-family:var(--body);font-size:17px;line-height:1.6;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:16px;padding:10px 12px;resize:vertical;min-height:84px}
.workbox textarea:focus,.review textarea:focus{outline:none;border-color:var(--violet)}
.review{display:flex;flex-direction:column;gap:8px;background:var(--card);border:3px dashed var(--violet);border-radius:18px;padding:12px}
.rv-t{font-family:var(--display);color:var(--violet);font-size:1.05rem}
.rv-msg{color:var(--muted);font-size:.95rem}
.rv-card{border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;border:3px solid var(--line)}
.rv-card.good{border-color:var(--good);background:var(--good-bg)}
.rv-card.fix{border-color:var(--sun);background:var(--card2)}
.rv-card h4{margin:0;font-family:var(--display);font-weight:400;font-size:1.2rem}
.rv-card b{font-family:var(--display);font-weight:400;color:var(--pri)}
.rv-list{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.small{font-size:.88rem}
/* 풀이 보기: 네온 빛 박스 */
.neonbox{display:flex;flex-direction:column;gap:10px}
.neonbox>summary{list-style:none;cursor:pointer;align-self:flex-start;display:inline-flex;align-items:center;gap:10px;position:relative;overflow:hidden;
  padding:10px 20px;border-radius:16px;border:3px solid var(--violet);background:var(--card);color:var(--violet);font-family:var(--display);font-size:1.15rem;
  transition:box-shadow .2s,border-color .2s,color .2s,transform .15s}
.neonbox>summary::-webkit-details-marker{display:none}
.neonbox>summary::before{content:"▶";font-size:.8em;transition:transform .2s}
.neonbox[open]>summary::before{transform:rotate(90deg)}
.neonbox>summary::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;
  background:radial-gradient(120px circle at var(--x,50%) var(--y,50%),rgba(95,245,230,.45),rgba(160,110,255,.18) 45%,transparent 70%)}
.neonbox>summary:hover,.neonbox>summary:focus-visible,.neonbox>summary:active{border-color:#3fe6d6;color:var(--ink);transform:translateY(-1px);
  box-shadow:0 0 0 2px #5ff5e6,0 0 14px #5ff5e6,0 0 30px rgba(140,90,255,.65),inset 0 0 12px rgba(95,245,230,.35);text-shadow:0 0 8px rgba(95,245,230,.9)}
.neonbox>summary:hover::after,.neonbox>summary:active::after{opacity:1}
@media (prefers-reduced-motion:reduce){.neonbox>summary{transition:none}}
.inlfb>.tip{border:3px solid var(--violet);display:flex;flex-direction:column;gap:8px}
.stamp{position:absolute;inset:0;z-index:60;display:grid;place-items:center;pointer-events:none}
body>.stamp{position:fixed}
.stamp>div{width:min(190px,48vw);aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:var(--card);border:8px solid currentColor;box-shadow:0 18px 50px rgba(0,0,0,.3);animation:stampin 1.4s ease forwards}
.stamp.ok{color:var(--good)} .stamp.no{color:var(--bad)}
.stamp span{font-family:var(--display);font-size:clamp(3.2rem,14vw,5rem);line-height:1}
.stamp b{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,7vw,2.3rem);line-height:1.1}
@keyframes stampin{0%{transform:scale(1.8) rotate(-12deg);opacity:0}18%{transform:scale(.92) rotate(-6deg);opacity:1}28%{transform:scale(1) rotate(-6deg)}78%{opacity:1}100%{transform:scale(1) rotate(-6deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.stamp>div{animation:none}}
.ansbox.right{border-style:solid;border-color:var(--good);background:var(--good-bg);color:var(--good)}
.ansbox.wrong{border-style:solid;border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.fb.good{background:var(--good-bg);color:var(--ink);border:3px solid var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--ink);border:3px solid var(--bad)}
.fb h3 .mark{color:var(--good)} .fb.bad h3 .mark{color:var(--bad)}
.tip{background:var(--card);border-radius:16px;padding:12px 14px;border:2px solid var(--line)}
.tip b{font-family:var(--display);font-weight:400;color:var(--pri)}
.steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
.steps li{padding-left:4px}
.progress{height:14px;border-radius:999px;background:var(--card2);overflow:hidden;border:2px solid var(--line)}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--pri));border-radius:999px;transition:width .4s}

/* roadmap & report */
.stage{border-left:6px solid var(--c,var(--violet));padding-left:14px;display:flex;flex-direction:column;gap:8px}
.units{display:flex;flex-wrap:wrap;gap:6px}
.unit{font-size:.92rem;border-radius:999px;padding:3px 12px;background:var(--card2);border:2px solid var(--line)}
.unit.app{border-color:var(--mint)}
.unit.done{background:var(--sun);border-color:var(--sun);color:#3b2a00}
.links{display:flex;flex-direction:column;gap:6px;font-size:.98rem}
.skillrow{display:grid;grid-template-columns:minmax(0,1fr) 110px 48px;gap:10px;align-items:center;font-size:.98rem}
.skillrow .progress{height:12px}
.skillrow span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat div{background:var(--card2);border-radius:18px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:1.7rem;color:var(--pri);font-variant-numeric:tabular-nums}
.wrongitem{border-top:2px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.save{font-size:.85rem;color:var(--muted);text-align:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.confetti i{position:absolute;top:-20px;width:12px;height:16px;border-radius:3px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.6}}
/* 첫 화면: 스크롤 없이 한 화면에 맞추기 */
body.home .topbar .chip{padding:2px 12px;font-size:.95rem}
body.home .hero{grid-template-columns:auto minmax(0,1fr);text-align:left;justify-items:stretch;gap:12px;padding:10px 14px;border-radius:22px;flex:none}
body.home .avatar{width:clamp(64px,13dvh,140px);height:clamp(64px,13dvh,140px)}
body.home .cam{width:clamp(28px,4.5dvh,38px);height:clamp(28px,4.5dvh,38px)}
body.home .hero h1{font-size:clamp(1.3rem,3.6dvh,2.1rem)}
body.home .bubble{font-size:clamp(.85rem,2.1dvh,1.05rem);line-height:1.45;padding:8px 12px;margin-top:4px}
body.home .tiles{flex:1;min-height:0;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr 1fr;gap:8px}
body.home .tile{min-height:0;padding:10px 12px;gap:2px;border-radius:20px;overflow:hidden;justify-content:center}
body.home .tile .ic{width:clamp(36px,6dvh,58px);height:clamp(36px,6dvh,58px);border-radius:12px;flex:none}
body.home .tile .ic svg{width:60%;height:60%}
body.home .tile .t{font-size:clamp(1rem,2.6dvh,1.35rem);line-height:1.25}
body.home .tile .d{font-size:clamp(.78rem,1.8dvh,.95rem);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
body.home .tile.big{min-height:0;padding:10px 14px;gap:12px;justify-content:flex-start}
body.home .tile .t{word-break:keep-all}
@media (max-width:380px){body.home .tile:not(.big) .t{font-size:1rem}body.home .tile:not(.big){column-gap:8px;padding:8px 10px}}
body.home .tile.big .ic{width:clamp(44px,7.5dvh,72px);height:clamp(44px,7.5dvh,72px)}
body.home .badge{top:6px;right:8px;min-width:24px;height:24px;font-size:.85rem}
body.home .card{padding:10px 14px;gap:6px;border-radius:20px;flex:none}
body.home .card h3{font-size:1rem}
body.home .path{gap:4px}
body.home .dot{width:clamp(18px,3dvh,30px);height:clamp(18px,3dvh,30px);font-size:.7rem}
body.home .gsep{height:clamp(18px,3dvh,30px);margin:0 2px}
body.home .legend{display:none}
body.home .save{font-size:.75rem;line-height:1.3;flex:none}
body.home .hero h1,body.home .hero .bubble{text-align:left}
body.home .tile:not(.big){display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;row-gap:2px;align-content:center;align-items:center}
body.home .tile:not(.big) .ic{grid-row:span 2}
@media (max-width:520px),(max-height:600px){body.home .tile:not(.big) .d{display:none}body.home .tile:not(.big) .ic{grid-row:auto}}
@media (max-height:600px){body.home .tile.big .d{display:none}}

/* 문제 화면: 스크롤 없이 한 화면에 맞추기 */
html:has(body.fit){height:100%}
body.fit{height:100%;min-height:0;margin:0;overflow:hidden;padding-block:8px}
body.fit .wrap{height:100%;gap:8px}
.qtop{display:flex;align-items:center;gap:8px}
.qtop h2{font-size:1.2rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qtop .back{padding:6px 12px;font-size:1rem}
body.fit .progress{height:10px;flex:none}
body.fit .qcard{flex:1;min-height:0;padding:12px 14px;gap:8px;border-radius:22px}
body.fit .q{font-size:clamp(1.2rem,3.6dvh,1.7rem);line-height:1.55;min-height:0;overflow:auto;flex:0 1 auto}
body.fit .q small{font-size:.9rem}
body.fit .ansbox{margin-top:auto;min-height:0;height:clamp(44px,7dvh,64px);flex:none;font-size:clamp(1.4rem,4dvh,2rem)}
body.fit .choices{margin-top:auto;gap:8px}
body.fit .ansbox.empty{font-size:1rem}
body.fit .pad{gap:6px;flex:none}

<script>
/* ================= 수학 유틸 ================= */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const RNZ=(a,b)=>{let v;do v=R(a,b);while(v===0);return v};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const M='−';
const n=x=>x<0?M+(-x):''+x;
const p=x=>x<0?`(${M}${-x})`:`(+${x})`;
const pp=x=>x<0?`(${M}${-x})`:''+x;
const fr=(a,b)=>{if(b<0){a=-a;b=-b}return `${a<0?M:''}<span class="fr"><span>${Math.abs(a)}</span><span>${b}</span></span>`};
const frR=(a,b)=>{const g=gcd(a,b)||1;a/=g;b/=g;if(b<0){a=-a;b=-b}return b===1?n(a):fr(a,b)};
const sup=e=>`<sup>${e}</sup>`;
const rt=x=>`√<span class="rt">${x}</span>`;
function poly(terms){let s='';for(const [c,v] of terms){if(c===0)continue;const a=Math.abs(c);const body=(a===1&&v)?v:a+v;if(!s)s=(c<0?M:'')+body;else s+=(c<0?` ${M} `:' + ')+body}return s||'0'}
const lin=(A,B,v='x')=>poly([[A,v],[B,'']]);
const tail=v=>v===0?'':(v<0?` ${M} ${-v}`:` + ${v}`);
const near=(a,b)=>Math.abs(a-b)<1e-6;
function factorStr(x){const f=[];let m=x;for(let d=2;d<=m;d++){let e=0;while(m%d===0){m/=d;e++}if(e)f.push(e>1?d+sup(e):''+d)}return f.join(' × ')}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
function mc(correct,dis,filler){const seen=new Set([correct]);const out=[{h:correct,ok:true}];
  for(const [h,tag] of dis){if(out.length>=4)break;if(!seen.has(h)){seen.add(h);out.push({h,ok:false,tag})}}
  let g=0;while(out.length<4&&g++<40){const h=filler();if(!seen.has(h)){seen.add(h);out.push({h,ok:false,tag:'calc'})}}
  return shuffle(out)}

/* ================= 실수 유형 ================= */
const TAGS={
  fracAdd:['분모끼리 더했어요','분수의 덧셈은 먼저 분모를 같게(통분) 만들고, 분자끼리만 더해요. 분모는 더하지 않아요!'],
  decimal:['소수점 위치 실수','두 소수의 "소수점 아래 자리 수"를 더한 만큼 답에도 소수점 아래 자리를 만들어요.'],
  ratioAdd:['비를 더하기로 계산했어요','비례식은 곱셈 관계예요. (바깥 두 수의 곱) = (안쪽 두 수의 곱)을 써요.'],
  gcdlcm:['최대공약수와 최소공배수 헷갈림','최대공약수 = 두 수를 함께 나누는 가장 큰 수. 최소공배수 = 두 수의 공통 배수 중 가장 작은 수.'],
  sign:['부호(+, −) 실수','계산이 끝나면 답의 부호를 꼭 한 번 더 확인해요. 음수가 몇 개인지 세어 보면 좋아요.'],
  subFlip:['빼기를 더하기로 바꿀 때 부호','(□) − (△)는 (□) + (빼는 수의 부호를 바꾼 △)로 바꿔요. 부호 바꾸기를 잊지 마요!'],
  power:['거듭제곱과 괄호','(−2)²은 (−2)×(−2)=4, −2²은 −(2×2)=−4예요. 괄호가 있는지 먼저 봐요.'],
  powerMul:['거듭제곱을 곱셈으로 착각','2³은 2×3이 아니라 2×2×2예요. 같은 수를 여러 번 곱하는 거예요.'],
  subst:['음수를 괄호 없이 넣었어요','음수를 대입할 때는 꼭 괄호를 씌워요. x = −2이면 x² = (−2)² = 4예요.'],
  distribute:['분배법칙 실수','괄호 앞의 수(특히 −)는 괄호 안의 모든 항에 곱해요. −3(x − 2) = −3x + 6.'],
  transpose:['이항할 때 부호','등호(=) 건너편으로 넘어가면 +는 −로, −는 +로 바뀌어요.'],
  xyswap:['x, y 자리 혼동','점 (x, y)에서 앞이 x, 뒤가 y예요. 정비례 y=ax는 a = y ÷ x, 반비례 y=a/x는 a = x × y.'],
  expLaw:['지수법칙 혼동','곱하면 지수끼리 더하고, 거듭제곱의 거듭제곱은 지수끼리 곱하고, 나누면 지수끼리 빼요.'],
  expand:['전개할 때 항을 빠뜨렸어요','(x + a)(x + b) = x² + (a + b)x + ab. 가운데 항(a + b)x를 빠뜨리지 마요.'],
  ineqFlip:['부등호 방향','양변을 음수로 곱하거나 나누면 부등호 방향이 반대로 바뀌어요!'],
  order:['x와 y를 바꿔 썼어요','답을 구한 뒤 처음 식에 넣어 맞는지 확인하면 순서 실수를 막을 수 있어요.'],
  slopeFlip:['기울기의 위아래가 바뀌었어요','기울기 = (y의 증가량) ÷ (x의 증가량). y가 위(분자)예요.'],
  sqrtSimp:['루트 밖으로 꺼내기','√(a² × b) = a√b. 제곱인 부분만 밖으로 나오고, 나올 때는 a(제곱근)로 나와요.'],
  factorConcept:['인수분해 두 수 찾기','곱해서 상수항, 더해서 x의 계수가 되는 두 수를 찾아요.'],
  calc:['계산 실수','한 줄씩 종이에 써서 천천히 다시 계산해 봐요. 암산보다 실수가 훨씬 줄어요.'],
  concept:['개념이 아직 헷갈려요','괜찮아요! 아래 풀이를 천천히 읽고, 비슷한 문제로 한 번 더 해 봐요.']
};

/* ================= 단원(스킬) ================= */
const SKILLS=[
 {id:'frac',g:'초6',name:'분수의 덧셈',concept:'분모가 다르면 먼저 통분(분모를 같게)한 뒤 분자끼리 더해요.',gen(){
   let b=R(2,9),d;do d=R(2,9);while(d===b);const a=R(1,b-1),c=R(1,d-1);const N=a*d+c*b,D=b*d,L=b*d/gcd(b,d);
   return {type:'num',q:`${fr(a,b)} + ${fr(c,d)} = ?<small>기약분수로 써요. 예: 7/6</small>`,ans:N/D,ansH:frR(N,D),
    diag:v=>near(v,(a+c)/(b+d))?'fracAdd':null,
    steps:[`분모 ${b}와 ${d}를 ${L}로 같게 만들어요(통분).`,`${fr(a*L/b,L)} + ${fr(c*L/d,L)}`,`분자끼리 더하면 ${fr(a*L/b+c*L/d,L)}`,`약분하면 <b>${frR(N,D)}</b>`]}}},
 {id:'dec',g:'초6',name:'소수의 곱셈',concept:'소수점을 떼고 곱한 뒤, 두 수의 소수점 아래 자리 수를 더한 만큼 소수점을 찍어요.',gen(){
   let X;do X=R(11,49);while(X%10===0);const Y=R(2,9);const ans=X*Y/100,x=X/10,y=Y/10;
   return {type:'num',q:`${x} × ${y} = ?`,ans,ansH:''+ans,
    diag:v=>(near(v,ans*10)||near(v,ans*100)||near(v,ans/10))?'decimal':null,
    steps:[`소수점을 떼고 계산: ${X} × ${Y} = ${X*Y}`,`${x}는 소수점 아래 1자리, ${y}도 1자리 → 모두 2자리`,`${X*Y} → <b>${ans}</b>`]}}},
 {id:'ratio',g:'초6',name:'비례식',concept:'비례식에서 (바깥 두 수의 곱) = (안쪽 두 수의 곱)이에요.',gen(){
   let a,b;do{a=R(2,9);b=R(2,9)}while(a===b||gcd(a,b)!==1);const k=R(2,6);
   return {type:'num',q:`${a} : ${b} = ${a*k} : □<br><small>□에 알맞은 수는?</small>`,ans:b*k,ansH:''+b*k,
    diag:v=>v===b+(a*k-a)?'ratioAdd':null,
    steps:[`바깥 두 수의 곱 = 안쪽 두 수의 곱`,`${a} × □ = ${b} × ${a*k} = ${a*b*k}`,`□ = ${a*b*k} ÷ ${a} = <b>${b*k}</b>`]}}},
 {id:'gcd',g:'중1',name:'최대공약수·최소공배수',concept:'소인수분해한 뒤, 공통인 소인수끼리 곱하면 최대공약수, 모든 소인수를 곱하면 최소공배수예요.',gen(){
   const g=R(2,6);let m1,m2;do{m1=R(2,7);m2=R(2,7)}while(m1===m2||gcd(m1,m2)!==1);const x=g*m1,y=g*m2,G=g,L=g*m1*m2;const askG=Math.random()<.5;
   const ans=askG?G:L;
   return {type:'num',q:`${x}와 ${y}의 <u>${askG?'최대공약수':'최소공배수'}</u>는?`,ans,ansH:''+ans,
    diag:v=>(v===(askG?L:G)||v===x*y)?'gcdlcm':null,
    steps:[`${x} = ${factorStr(x)}`,`${y} = ${factorStr(y)}`,`최대공약수 = ${G}, 최소공배수 = ${G} × ${m1} × ${m2} = ${L}`,`그래서 답은 <b>${ans}</b>`]}}},
 {id:'iadd',g:'중1',name:'정수의 덧셈·뺄셈',concept:'부호가 같으면 더하고 같은 부호, 다르면 큰 쪽에서 작은 쪽을 빼고 큰 쪽 부호. 빼기는 부호를 바꿔 더하기로!',gen(){
   const x=RNZ(-12,12),y=RNZ(-12,12),op=pick(['+','−']);const ans=op==='+'?x+y:x-y;const z=op==='+'?y:-y;
   return {type:'num',q:`${p(x)} ${op} ${p(y)} = ?`,ans,ansH:n(ans),
    diag:v=>(op==='−'&&v===x+y&&v!==ans)?'subFlip':(v===-ans&&ans!==0?'sign':null),
    steps:[op==='−'?`빼기를 더하기로: ${p(x)} + ${p(-y)} (빼는 수의 부호를 바꿔요)`:`${p(x)} + ${p(y)}`,
      (x>0)===(z>0)?`두 수의 부호가 같아요 → 절댓값끼리 더하고(${Math.abs(x)}+${Math.abs(z)}) 같은 부호를 붙여요.`:`부호가 달라요 → 절댓값이 큰 수에서 작은 수를 빼고(${Math.max(Math.abs(x),Math.abs(z))}−${Math.min(Math.abs(x),Math.abs(z))}), 절댓값이 큰 수의 부호를 붙여요.`,
      `답: <b>${n(ans)}</b>`]}}},
 {id:'imul',g:'중1',name:'정수의 곱셈·거듭제곱',concept:'음수가 짝수 개면 +, 홀수 개면 −. (−2)²과 −2²은 달라요!',gen(){
   if(Math.random()<.55){const fs=[RNZ(-9,9),RNZ(-9,9)];if(Math.random()<.5)fs.push(pick([-2,-3,2,3,-4,5]));const ans=fs.reduce((s,v)=>s*v,1);const neg=fs.filter(v=>v<0).length;
     return {type:'num',q:fs.map(p).join(' × ')+' = ?',ans,ansH:n(ans),diag:v=>(v===-ans&&ans!==0)?'sign':null,
      steps:[`음수의 개수: ${neg}개 → ${neg%2===0?'짝수 개라서 +':'홀수 개라서 −'}`,`절댓값끼리 곱하기: ${fs.map(Math.abs).join(' × ')} = ${Math.abs(ans)}`,`답: <b>${n(ans)}</b>`]}}
   const a=pick([2,3]),e=R(2,4),paren=Math.random()<.5;const base=Math.pow(a,e);const ans=paren?(e%2?-base:base):-base;
   return {type:'num',q:(paren?`(${M}${a})${sup(e)}`:`${M}${a}${sup(e)}`)+' = ?',ans,ansH:n(ans),
    diag:v=>(Math.abs(v)===a*e&&a*e!==base)?'powerMul':((v===-ans)?'power':null),
    steps:paren?[`(${M}${a})${sup(e)}은 (${M}${a})를 ${e}번 곱해요.`,`음수 ${e}개 → ${e%2?'홀수 개라서 −':'짝수 개라서 +'}`,`답: <b>${n(ans)}</b>`]
               :[`${M}${a}${sup(e)}은 괄호가 없어서 ${a}${sup(e)}만 먼저 계산해요: ${a}${sup(e)} = ${base}`,`그 앞에 −를 붙여요.`,`답: <b>${n(ans)}</b>`]}}},
 {id:'subs',g:'중1',name:'문자식에 수 대입',concept:'문자 자리에 수를 넣을 때, 음수는 반드시 괄호를 씌워요.',gen(){
   const xv=RNZ(-3,3),A=R(1,3),B=RNZ(-5,5),C=R(-6,6);const ans=A*xv*xv+B*xv+C;const wrong=-A*xv*xv+B*xv+C;
   return {type:'num',q:`x = ${n(xv)}일 때,<br>${poly([[A,'x²'],[B,'x'],[C,'']])}의 값은?`,ans,ansH:n(ans),
    diag:v=>(xv<0&&v===wrong&&wrong!==ans)?'subst':(v===-ans&&ans!==0?'sign':null),
    steps:[`x 자리에 ${pp(xv)}를 괄호와 함께 넣어요.`,`${A===1?'':A+' × '}${p(xv)}² ${B<0?M:'+'} ${Math.abs(B)} × ${p(xv)}${tail(C)}`,`= ${n(A*xv*xv)}${tail(B*xv)}${tail(C)}`,`= <b>${n(ans)}</b>`]}}},
 {id:'lin',g:'중1',name:'일차식의 계산',concept:'괄호 앞의 수를 괄호 안 모든 항에 곱한 다음(분배법칙), 같은 문자끼리·수끼리 모아요.',gen(){
   let a,b;do{a=R(2,5);b=R(2,5)}while(a===b);const P=RNZ(-6,6),Q=RNZ(-6,6);const C=lin(a-b,a*P-b*Q);
   return {type:'mc',q:`${a}(${lin(1,P)}) ${M} ${b}(${lin(1,Q)})<br><small>간단히 하면?</small>`,
    choices:mc(C,[[lin(a-b,a*P+b*Q),'distribute'],[lin(a-b,a*P-Q),'distribute'],[lin(a+b,a*P-b*Q),'sign']],()=>lin(a-b+RNZ(-2,2),a*P-b*Q+RNZ(-3,3))),ansH:C,
    steps:[`${a}(${lin(1,P)}) = ${lin(a,a*P)}`,`${M}${b}(${lin(1,Q)}) = ${lin(-b,-b*Q)} ← 괄호 앞 −${b}를 두 항 모두에 곱해요.`,`x끼리: ${a} ${M} ${b} = ${n(a-b)}, 수끼리: ${n(a*P)}${tail(-b*Q)} = ${n(a*P-b*Q)}`,`답: <b>${C}</b>`]}}},
 {id:'eq1',g:'중1',name:'일차방정식',concept:'x가 있는 항은 왼쪽, 수는 오른쪽으로 이항(부호 바꿔 넘기기)한 다음 x의 계수로 나눠요.',gen(){
   let a,c;do{a=RNZ(-5,6);c=R(-4,5)}while(a===c);const s=R(-6,6),b=R(-9,9),d=a*s+b-c*s;
   const wrong=(a-c)!==0?(d+b)/(a-c):NaN;
   return {type:'num',q:`${lin(a,b)} = ${lin(c,d)}<br><small>x의 값은?</small>`,ans:s,ansH:n(s),
    diag:v=>(near(v,wrong)&&!near(wrong,s))?'transpose':(v===-s&&s!==0?'sign':null),
    steps:[`x 항은 왼쪽, 수는 오른쪽으로 이항해요. 넘어가면 부호가 바뀌어요.`,`${lin(a,0)}${c===0?'':(c>0?` ${M} `:' + ')+lin(Math.abs(c),0)} = ${n(d)}${tail(-b)}`,`${lin(a-c,0)} = ${n(d-b)}`,`x = ${n(d-b)} ÷ ${pp(a-c)} = <b>${n(s)}</b>`]}}},
 {id:'prop',g:'중1',name:'정비례·반비례',concept:'정비례 y = ax 에서 a = y ÷ x. 반비례 y = a/x 에서 a = x × y.',gen(){
   if(Math.random()<.5){const a=RNZ(-5,5),x=RNZ(-4,4),y=a*x;
     return {type:'num',q:`정비례 y = ax의 그래프가<br>점 (${n(x)}, ${n(y)})을 지나요. a는?`,ans:a,ansH:n(a),
      diag:v=>(near(v,x/y)&&!near(x/y,a))?'xyswap':(v===-a?'sign':null),
      steps:[`점의 좌표를 y = ax에 넣어요: ${n(y)} = a × ${pp(x)}`,`a = ${n(y)} ÷ ${pp(x)} = <b>${n(a)}</b>`]}}
   const a=pick([6,8,12,18,24])*pick([1,-1]);const ds=[1,2,3,4,6].filter(d=>Math.abs(a)%d===0);const x=pick(ds)*pick([1,-1]),y=a/x;
   return {type:'num',q:`반비례 y = <span class="fr"><span>a</span><span>x</span></span>의 그래프가<br>점 (${n(x)}, ${n(y)})을 지나요. a는?`,ans:a,ansH:n(a),
    diag:v=>(near(v,y/x)&&!near(y/x,a))?'xyswap':(v===-a?'sign':null),
    steps:[`반비례에서 a = x × y 예요.`,`a = ${pp(x)} × ${pp(y)} = <b>${n(a)}</b>`]}}},
 {id:'exp',g:'중2',name:'지수법칙',concept:'aᵐ × aⁿ = aᵐ⁺ⁿ, (aᵐ)ⁿ = aᵐˣⁿ, aᵐ ÷ aⁿ = aᵐ⁻ⁿ',gen(){
   const k=R(3,5),kind=pick(['mul','pow','div']);const v=pick(['a','x']);
   if(kind==='mul'){const m=R(2,6);return {type:'num',q:`${v}${sup(m)} × ${v}${sup(k)} = ${v}${sup('□')}<br><small>□는?</small>`,ans:m+k,ansH:''+(m+k),diag:t=>t===m*k?'expLaw':null,steps:[`밑이 같은 수의 곱셈은 지수끼리 더해요.`,`${m} + ${k} = <b>${m+k}</b>`]}}

const LK='elisa-lock',LU='elisa-unlocked',LP='elisa-photo';
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
let lockHash=lsGet(LK),photo=lsGet(LP),memUnlocked=lsGet(LU),canSetPin=true,boot='loading';
const unlocked=()=>!!lockHash&&memUnlocked===lockHash;
function gate(){if(boot==='loading')return 'splash';if(!lockHash)return canSetPin?'setpin':'nopin';if(!unlocked())return 'lock';return null}
async function hashPin(pin){const txt='elisa-math:'+pin;
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(const c of txt)h=((h*33)^c.charCodeAt(0))>>>0;return 'h'+h.toString(16)}}
async function savePin(pin){const h=await hashPin(pin);lockHash=h;memUnlocked=h;lsSet(LK,h);lsSet(LU,h);
  if(db){try{await db.collection('settings').doc('lock').set({hash:h,updatedAt:Date.now()});return true}catch(e){return false}}return true}

async function setPhoto(file){if(!file||!/^image\//.test(file.type||'image/'))return;
  const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();
    const sz=Math.min(img.naturalWidth,img.naturalHeight);const c=document.createElement('canvas');c.width=c.height=320;
    c.getContext('2d').drawImage(img,(img.naturalWidth-sz)/2,(img.naturalHeight-sz)/2,sz,sz,0,0,320,320);
    photo=c.toDataURL('image/jpeg',.82);lsSet(LP,photo);
    if(db)db.collection('elisa').doc('photo').set({src:photo,updatedAt:Date.now()}).catch(()=>{});
  }catch(e){}finally{URL.revokeObjectURL(url)}render()}

(async()=>{await new Promise(r=>setTimeout(r,0));const t=setTimeout(()=>{if(boot==='loading'){boot='ready';render()}},3000);
  try{if(window.claude){const [d,u]=await Promise.all([claude.use('db'),claude.use('user')]);

      const [lk,ph,pr]=await Promise.all([db.collection('settings').doc('lock').get(),db.collection('elisa').doc('photo').get(),db.collection('elisa').doc('progress').get()]);
      const before=gate();
      if(lk.exists&&lk.data().hash)lockHash=lk.data().hash;
      else if(lockHash&&canSetPin){db.collection('settings').doc('lock').set({hash:lockHash,updatedAt:Date.now()}).catch(()=>{})}

      lsSet(LK,lockHash);
      if(ph.exists){photo=ph.data().src||null;lsSet(LP,photo)}
      docRef=db.collection('elisa').doc('progress');

      if(!remote&&u){const id=await u.id();if(id){const old=await db.collection('data/users/'+id).doc('progress').get();if(old.exists)remote=old.data()}}
      if(remote&&remote.v===1&&(remote.updatedAt||0)>=(S.updatedAt||0)){S=Object.assign(blank(),JSON.parse(JSON.stringify(remote)));try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
      if(!pr.exists&&S.updatedAt)save();
      saveMode='cloud';

/* ---- 진단 & 연습 세션 ---- */
function startDiag(){sess={mode:'diag',i:0,res:[],wrongRun:0,wrongTotal:0};nextQ()}
function startPractice(reviewOnly){if(reviewOnly&&!Object.keys(S.review).length){sess={mode:'empty'};view='quiz';render();return}
  sess={mode:reviewOnly?'review':'practice',count:0,goal:10,correct:0,forceSkill:null};nextQ()}
function chooseSkill(){
  if(sess.forceSkill){const f=sess.forceSkill;sess.forceSkill=null;return {id:f,rev:true}}
  const revs=Object.keys(S.review);
  if(sess.mode==='review')return revs.length?{id:pick(revs),rev:true}:null;
  if(revs.length&&Math.random()<.35)return {id:pick(revs),rev:true};
  const ci=curIndex();const done=SKILLS.slice(0,ci).filter(s=>mastered(s.id));
  if(done.length&&Math.random()<.25)return {id:pick(done).id,rev:false,old:true};
  return {id:SKILLS[ci].id,rev:false}}
function nextQ(){view='quiz';
  if(sess.mode==='diag'){if(sess.i>=SKILLS.length||sess.wrongRun>=3||sess.wrongTotal>=5)return finishDiag();sess.skill=SKILLS[sess.i].id;sess.rev=false}
  else{if(sess.count>=sess.goal)return finishPractice();const c=chooseSkill();if(!c)return finishPractice();sess.skill=c.id;sess.rev=c.rev;sess.old=c.old}
  sess.prob=SK[sess.skill].gen();sess.work='';sess.workOpen=false;sess.input='';sess.answered=false;sess.pickIdx=null;render()}

function quiz(){
  if(sess.mode==='empty'){app.innerHTML=`${topBar('오답 복습')}<section class="qcard" style="align-items:center;text-align:center">${MASCOT}<h2>복습할 문제가 없어요!</h2><p class="muted">틀린 문제가 생기면 여기에 모여요.</p><button class="btn pri" data-go="practice">오늘의 연습 하러 가기</button></section>`;return}
  if(sess.mode==='result'){app.innerHTML=sess.html;return}
  const s=SK[sess.skill],P=sess.prob;
  const prog=sess.mode==='diag'?`진단 ${sess.i+1} / ${SKILLS.length}`:`${sess.count+1} / ${sess.goal}`;
  const pct=sess.mode==='diag'?sess.i/SKILLS.length*100:sess.count/sess.goal*100;
  let body;
  if(P.type==='num')body=`<div class="ansbox ${sess.input?'':'empty'}" id="ans" aria-live="polite">${sess.input?esc(sess.input.replace(/-/g,M)):'아래 숫자판으로 답을 입력해요'}</div>
    <div class="pad" id="pad">${['7','8','9','⌫','4','5','6','/','1','2','3','−','0','.'].map(k=>`<button class="${/[0-9]/.test(k)?'':'op'}" data-k="${k}" aria-label="${k==='⌫'?'지우기':k==='/'?'분수 막대':k}">${k}</button>`).join('')}<button class="go" data-k="ok">확인</button></div>`;
  else body=`<div class="choices">${P.choices.map((c,i)=>`<button data-c="${i}">${c.h}</button>`).join('')}</div>`;
  app.innerHTML=`<div class="qtop"><button class="back" data-go="home">← 처음</button><h2>${sess.mode==='diag'?'실력 진단':sess.mode==='review'?'오답 복습':'오늘의 연습'}</h2><span class="chip">${prog}</span></div>
  <div class="progress"><i style="width:${pct}%"></i></div>
  <section class="qcard"><div class="qhead"><span class="tag">${s.g} · ${s.name}</span>${sess.rev?'<span class="tag rev">비슷한 문제 다시!</span>':''}</div>
   <div class="q">${P.q}</div>
   <div class="workbox" id="workBox" ${sess.workOpen?'':'hidden'}><label for="work">내 풀이 과정 <span class="muted">(어떻게 풀었는지 한 줄씩)</span></label>
     <textarea id="work" rows="3" placeholder="예: 통분하면 8/12 + 3/12&#10;분자끼리 더하면 11/12">${esc(sess.work||'')}</textarea></div>
   ${body}
   <div class="row"><button class="btn ghost" id="idk">잘 모르겠어요</button><button class="btn ghost" id="hint">개념 힌트</button><button class="btn ghost" id="workT">${sess.workOpen?'풀이 접기':'풀이 쓰기'}</button></div>
   <div id="fb" class="inlfb" hidden></div></section>`;
  document.getElementById('hint').onclick=()=>tipSheet(`<b>루미의 힌트</b>${s.concept}`);
  const wt=document.getElementById('work');if(wt)wt.oninput=()=>{sess.work=wt.value};
  document.getElementById('workT').onclick=()=>{sess.workOpen=!sess.workOpen;const wb=document.getElementById('workBox');wb.hidden=!sess.workOpen;
    document.getElementById('workT').textContent=sess.workOpen?'풀이 접기':'풀이 쓰기';if(sess.workOpen)wt.focus()};
  document.getElementById('idk').onclick=()=>answer(null);
  if(P.type==='num'){document.getElementById('pad').onclick=e=>{const b=e.target.closest('button');if(b)key(b.dataset.k)}}
  else app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>answer(+b.dataset.c))}
function key(k){if(view!=='quiz'||!sess||sess.answered||!sess.prob||sess.prob.type!=='num')return;
  if(k==='ok'){if(sess.input)answer(sess.input);else tipSheet('먼저 답을 입력한 다음 <b>확인</b>을 눌러요.');return}
  if(k==='⌫')sess.input=sess.input.slice(0,-1);else if(k==='−'||k==='-'){sess.input=sess.input.startsWith('-')?sess.input.slice(1):'-'+sess.input}
  else if(sess.input.length<9)sess.input+=k;
  const a=document.getElementById('ans');a.className='ansbox'+(sess.input?'':' empty');a.textContent=sess.input?sess.input.replace(/-/g,M):'아래 숫자판으로 답을 입력해요'}
document.addEventListener('keydown',e=>{if(e.target&&e.target.closest&&e.target.closest('textarea,input'))return;const g=gate();if(g==='lock'||g==='setpin'||(!g&&view==='setpin')){if(/^[0-9]$/.test(e.key))pinKey(e.key);else if(e.key==='Backspace')pinKey('⌫');else if(e.key==='Enter')pinKey('ok');return}
  if(g||view!=='quiz'||!sess||!sess.prob)return;
  if(sess.answered&&e.key==='Enter'){const nx=document.getElementById('next');if(nx){e.preventDefault();nx.click()}return}
  if(/^[0-9./]$/.test(e.key))key(e.key);else if(e.key==='-')key('-');else if(e.key==='Backspace')key('⌫');else if(e.key==='Enter')key('ok')});
function parse(s){s=s.replace(/−/g,'-').trim();if(s.includes('/')){const [a,b]=s.split('/');const x=+a,y=+b;return (a===''||b===''||!y)?NaN:x/y}return s===''||s==='-'?NaN:+s}

function answer(given){if(sess.answered)return;const P=sess.prob,s=SK[sess.skill];let ok,tag=null,givenH;
  if(given===null){ok=false;tag='concept';givenH='모르겠어요'}
  else if(P.type==='num'){const v=parse(given);if(isNaN(v)){tipSheet('숫자를 다시 확인해 줘요. 분수는 3/4처럼 써요.');return}
    ok=near(v,P.ans);givenH=given.replace(/-/g,M);if(!ok)tag=P.diag(v)||'calc'}
  else{const c=P.choices[given];ok=c.ok;givenH=c.h;if(!ok)tag=c.tag||'calc';
    app.querySelectorAll('[data-c]').forEach((b,i)=>{b.disabled=true;if(P.choices[i].ok)b.classList.add('right');else if(i===given)b.classList.add('wrong')})}
  sess.answered=true;
  const pad=document.getElementById('pad');if(pad)pad.hidden=true;
  const idk=app.querySelector('#idk');if(idk)idk.parentElement.hidden=true;
  // 기록
  const k=sk(sess.skill);const wasM=mastered(sess.skill);k.n++;if(ok){k.c++;k.m=k.m*.6+.4}else k.m=k.m*.6;
  S.total.n++;if(ok)S.total.c++;
  if(S.daily.date!==today())S.daily={date:today(),count:0};S.daily.count++;
  if(ok){S.stars++;if(S.review[sess.skill]){S.review[sess.skill]--;if(!S.review[sess.skill])delete S.review[sess.skill]}}
  else{S.mistakes[tag]=(S.mistakes[tag]||0)+1;S.review[sess.skill]=Math.min(3,(S.review[sess.skill]||0)+2)}
  S.history.unshift({t:Date.now(),skill:sess.skill,ok,tag,q:P.q.replace(/<small>.*?<\/small>/g,''),given:givenH,ans:P.ansH});S.history=S.history.slice(0,60);
  const levelUp=!wasM&&mastered(sess.skill)&&sess.mode!=='diag';
  if(sess.mode==='diag'){sess.res.push({id:sess.skill,ok});if(ok)sess.wrongRun=0;else{sess.wrongRun++;sess.wrongTotal++}}
  else{sess.count++;if(ok)sess.correct++;else sess.forceSkill=sess.skill}
  save();
  const praise=pick(['정답! 최고야!','맞았어! 대단해!','완벽해! 이 느낌 그대로!','정답! 실력이 쑥쑥 크고 있어!']);
  const ab=document.getElementById('ans');if(ab)ab.classList.add(ok?'right':'wrong');
  stamp(ok);
  const fb=document.getElementById('fb');fb.hidden=false;
  fb.innerHTML=ok?`<div class="fb good"><h3><span class="mark">○</span> 정답이에요! ${praise}</h3>
    <p>엘리사의 답: <b>${givenH}</b> — 맞았어요.</p>${levelUp?`<div class="tip"><b>레벨 업!</b> “${s.name}” 단원을 통과했어요. 다음 단원으로 넘어가요!</div>`:''}
    <details class="neonbox"><summary>풀이 보기</summary><ol class="steps">${P.steps.map(x=>`<li>${x}</li>`).join('')}</ol></details>
    <button class="btn pri" id="next">다음 문제 →</button></div>`
   :`<div class="fb bad"><h3><span class="mark">✕</span> ${given===null?'괜찮아, 같이 풀어 보자!':'오답이에요. 어디서 틀렸는지 보자'}</h3>
    ${given===null?'':`<p>엘리사의 답: <b>${givenH}</b> · 정답: <b>${P.ansH}</b></p>`}
    <div class="tip"><b>루미가 찾은 실수: ${TAGS[tag][0]}</b><br>${TAGS[tag][1]}</div>
    <ol class="steps">${P.steps.map(x=>`<li>${x}</li>`).join('')}</ol>
    <button class="btn pri" id="next">${sess.mode==='diag'?'다음 문제 →':'비슷한 문제로 다시 도전 →'}</button></div>`;
  setTimeout(()=>fb.scrollIntoView({block:'nearest'}),0);
  if(ok)confetti(levelUp?60:18);
  document.getElementById('next').onclick=()=>{if(sess.mode==='diag')sess.i++;nextQ()};
  addReview(fb.querySelector('.fb'),P,s,ok,givenH);
}
document.addEventListener('pointermove',e=>{const s=e.target&&e.target.closest&&e.target.closest('.neonbox>summary');if(!s)return;const r=s.getBoundingClientRect();s.style.setProperty('--x',(e.clientX-r.left)+'px');s.style.setProperty('--y',(e.clientY-r.top)+'px')},{passive:true});
/* ---- 루미 선생님 풀이 검사 (Claude) ---- */
let SAMPLE=null;(async()=>{try{if(window.claude)SAMPLE=await claude.use('sample')}catch(e){}})();
function plainMath(html){const d=document.createElement('div');d.innerHTML=html;d.querySelectorAll('small').forEach(x=>x.remove());
  d.querySelectorAll('.fr').forEach(f=>{const c=f.children;f.replaceWith(`(${c[0].textContent}/${c[1].textContent})`)});
  d.querySelectorAll('sup').forEach(x=>x.replaceWith('^'+x.textContent));d.querySelectorAll('.rt').forEach(x=>x.replaceWith('('+x.textContent+')'));
  d.querySelectorAll('br,li').forEach(x=>x.after(' / '));return d.textContent.replace(/\s+/g,' ').replace(/(\s*\/\s*)+$/,'').trim()}
function addReview(box,P,s,ok,givenH){if(!box)return;const next=box.querySelector('#next');
  const el=document.createElement('div');el.className='review';
  el.innerHTML=`<p class="rv-t">루미 선생님께 내 풀이 보여 주기</p>
    <textarea id="work2" rows="3" placeholder="어떻게 풀었는지 한 줄씩 적어 줘.&#10;예: 통분하면 8/12 + 3/12, 분자끼리 더하면 11/12">${esc(sess.work||'')}</textarea>
    ${SAMPLE?'<button class="btn" id="rvGo">풀이 검사받기</button>':'<p class="muted small">풀이 검사는 claude.ai에서 열었을 때 쓸 수 있어요.</p>'}
    <div id="rvOut" aria-live="polite"></div>`;
  box.insertBefore(el,next);
  const t=el.querySelector('#work2');t.oninput=()=>{sess.work=t.value};
  const go=el.querySelector('#rvGo');if(go)go.onclick=()=>reviewWork(P,s,ok,givenH,t.value.trim(),el)}
async function reviewWork(P,s,ok,givenH,work,el){const out=el.querySelector('#rvOut'),go=el.querySelector('#rvGo');
  if(!work){out.innerHTML='<div class="rv-msg">먼저 풀이 과정을 적어 줘. 한두 줄이어도 괜찮아!</div>';return}
  go.disabled=true;go.textContent='루미 선생님이 읽는 중…';out.innerHTML='<div class="rv-msg">루미 선생님이 엘리사의 풀이를 한 줄씩 보고 있어요…</div>';
  const prompt=`너는 초등학교 6학년 엘리사에게 중학교 수학을 가르치는 다정한 수학 선생님 "루미"야. 엘리사가 쓴 풀이 과정을 검사해 줘.

[단원] ${s.g} · ${s.name}
[문제] ${plainMath(P.q)}
[정답] ${plainMath(P.ansH)}
[엘리사가 낸 답] ${plainMath(givenH||'')} (${ok?'정답':'오답'})
[모범 풀이] ${P.steps.map(x=>plainMath(x)).join(' → ')}
[엘리사의 풀이 과정]
${work.slice(0,1500)}

검사 규칙:
- 초등학교 6학년이 이해할 수 있는 쉬운 한국어로, 친구 같은 다정한 반말로 말해.
- 엘리사의 풀이를 한 단계씩 확인해. 맞게 한 부분은 무엇을 잘했는지 구체적으로 칭찬해.
- 틀리거나 빠진 단계가 있으면 어느 줄이, 왜 틀렸는지, 어떻게 고치면 되는지 친절하게 설명해. 혼내는 말은 쓰지 마.
- 답만 적었거나 풀이가 너무 짧으면, 어떤 단계를 적으면 좋은지 알려 줘.
- 모범 풀이를 처음부터 다시 다 풀어 주지 말고, 엘리사가 쓴 풀이를 중심으로 말해.
- 수식은 3/4, x^2 처럼 쉬운 글자로 써.

아래 JSON 하나만 출력해:
{"verdict":"perfect 또는 almost 또는 needs_work","praise":"잘한 점 칭찬 1~2문장","mistakes":[{"where":"엘리사가 쓴 어느 부분","explain":"무엇이 틀렸고 어떻게 고치는지"}],"tip":"다음 비슷한 문제에서 꼭 기억할 한 가지"}
풀이가 완벽하면 verdict는 perfect, mistakes는 빈 배열로 해.`;
  let r;
  try{r=await SAMPLE.json(prompt)}
  catch(e){go.disabled=false;go.textContent='풀이 검사받기';
    out.innerHTML=`<div class="rv-msg">${e&&e.code==='not_granted'?'루미 선생님 검사를 쓰려면 허락이 필요해요. 화면에 뜨는 허락 창에서 허락해 주세요.':e&&e.code==='rate_limited'?'잠깐 쉬었다가 다시 눌러 줘.':'지금은 검사를 못 했어요. 잠시 뒤에 다시 눌러 줘.'}</div>`;return}
  const perfect=r&&r.verdict==='perfect'&&!(r.mistakes&&r.mistakes.length);
  const ms=(r&&Array.isArray(r.mistakes)?r.mistakes:[]).slice(0,5);
  out.innerHTML=`<div class="rv-card ${perfect?'good':'fix'}">
    <h4>${perfect?'○ 완벽한 풀이야!':r.verdict==='almost'?'거의 다 왔어! 한 군데만 같이 보자':'같이 고쳐 보자'}</h4>
    ${r.praise?`<p><b>잘한 점</b> ${esc(r.praise)}</p>`:''}
    ${ms.length?`<ol class="rv-list">${ms.map(m=>`<li><b>${esc(m.where||'')}</b><br>${esc(m.explain||'')}</li>`).join('')}</ol>`:''}
    ${r.tip?`<p class="rv-tip"><b>기억할 것</b> ${esc(r.tip)}</p>`:''}</div>`;
  go.textContent='다시 검사받기';go.disabled=false;
  // 기록: 풀이에 실수가 있으면 이 단원을 다시 연습하도록
  try{if(S.history[0]){S.history[0].work=work.slice(0,500);S.history[0].review=perfect?'perfect':(r.verdict||'needs_work')}
    if(!perfect)S.review[sess.skill]=Math.min(3,(S.review[sess.skill]||0)+1);save()}catch(e){}
  const next=document.getElementById('next');
  if(next){if(sess.mode==='diag'){out.insertAdjacentHTML('beforeend','<p class="muted small">진단이 끝나면 이 단원의 비슷한 문제를 연습에서 다시 내 줄게.</p>')}
    else{sess.forceSkill=sess.skill;next.textContent='비슷한 문제 바로 풀기 →'}}
  out.scrollIntoView({block:'nearest'})}
function stamp(ok){const d=document.createElement('div');d.className='stamp '+(ok?'ok':'no');d.setAttribute('role','status');
  d.innerHTML=`<div><span>${ok?'○':'✕'}</span><b>${ok?'정답':'오답'}</b></div>`;(app.querySelector('.qcard')||document.body).appendChild(d);setTimeout(()=>d.remove(),1400)}
function tipSheet(h){const f=document.getElementById('fb');if(!f)return;f.hidden=false;setTimeout(()=>f.scrollIntoView({block:'nearest'}),0);f.innerHTML=`<div class="tip">${h}<button class="btn pri" id="closeTip">알겠어요</button></div>`;document.getElementById('closeTip').onclick=()=>{f.hidden=true;f.innerHTML=''}}

function finishDiag(){const res=sess.res;let start=res.findIndex(r=>!r.ok);if(start<0)start=Math.min(res.length,SKILLS.length-1);
  res.forEach((r,i)=>{if(r.ok&&i<start){const k=sk(r.id);k.m=Math.max(k.m,.8);k.n=Math.max(k.n,3)}});
  // 진단에서 틀린 단원보다 앞 단원은 통과 처리, 나머지는 그대로
  S.diag={date:today(),start,score:res.filter(r=>r.ok).length,of:res.length};save();
  const s=SKILLS[curIndex()];
  sess={mode:'result',html:`${topBar('진단 결과')}<section class="qcard" style="align-items:center;text-align:center">${MASCOT}
   <h2>엘리사의 출발점은<br><span style="color:var(--pri)">${s.g} · ${s.name}</span></h2>
   <p class="muted">${res.length}문제 중 ${S.diag.score}문제 정답. 루미가 이 결과를 기억하고, 여기서부터 문제를 낼게요.</p></section>
   <section class="card"><h3>문제별 결과</h3>${res.map(r=>`<div class="skillrow"><span>${SK[r.id].g} · ${SK[r.id].name}</span><span></span><span style="color:${r.ok?'var(--good)':'var(--bad)'}">${r.ok?'○ 정답':'✕ 복습'}</span></div>`).join('')}
   ${res.length<SKILLS.length?`<p class="muted">앞 단원부터 탄탄하게 하려고 진단을 여기서 멈췄어요. 남은 단원은 연습하면서 차례로 열려요.</p>`:''}</section>
   <div class="row"><button class="btn pri grow" data-go="practice">바로 연습 시작</button><button class="btn grow" data-go="road">로드맵 보기</button></div>`};
  view='quiz';render();confetti(40)}
function finishPractice(){const c=sess.correct,t=sess.count;const s=SKILLS[curIndex()];
  sess={mode:'result',html:`${topBar('오늘의 결과')}<section class="qcard" style="align-items:center;text-align:center">${MASCOT}
   <h2>${t?`${t}문제 중 <span style="color:var(--pri)">${c}문제</span> 정답!`:'복습 완료!'}</h2>
   <p>${c===t?'완벽해! 루미가 깜짝 놀랐어!':c>=t*.7?'아주 잘했어! 틀린 문제는 루미가 기억해 뒀다가 다시 낼게.':'어려운 단원이었지? 괜찮아. 틀린 유형은 비슷한 문제로 다시 연습하자.'}</p>
   <p class="muted">다음 단계: ${s.g} · ${s.name}</p></section>
   <div class="row"><button class="btn pri grow" data-go="practice">10문제 더 하기</button><button class="btn grow" data-go="home">처음으로</button></div>`};
  view='quiz';render();confetti(c===t&&t?60:20)}

/* ---- 로드맵 ---- */
const yt=q=>`<a href="https://www.youtube.com/results?search_query=${encodeURIComponent(q)}" target="_blank" rel="noopener">유튜브에서 “${q}” 찾기</a>`;
const ROAD=[
 {g:'초6',c:'var(--sun)',title:'초6 다지기',units:['분수의 덧셈·뺄셈','분수·소수의 곱셈과 나눗셈','비와 비율','비례식과 비례배분'],
  tip:'중학교 수학의 계산은 거의 다 분수와 소수 위에서 이루어져요. 분수 계산이 빨라야 중1이 편해요.',q:['초6 분수의 나눗셈 개념','초6 비례식과 비례배분']},
 {g:'중1',c:'var(--pri)',title:'중1 · 수와 식의 기초',units:['소인수분해','정수와 유리수','문자와 식','일차방정식','좌표평면과 그래프','기본 도형·작도','평면·입체도형','자료의 정리'],
  tip:'가장 중요한 건 "정수 계산"과 "부호"예요. 여기서 부호 실수를 잡으면 중2·중3이 훨씬 쉬워져요. 하루 20분, 10문제 + 오답 복습을 추천해요.',q:['중1 정수와 유리수 개념','중1 일차방정식 개념','중1 정비례 반비례']},
 {g:'중2',c:'var(--violet)',title:'중2 · 식과 함수',units:['유리수와 순환소수','식의 계산(지수법칙)','일차부등식','연립일차방정식','일차함수','삼각형·사각형의 성질','도형의 닮음','확률'],
  tip:'중1의 일차방정식이 바탕이에요. 부등식에서는 "음수로 나누면 방향이 바뀐다", 함수에서는 "기울기 = y증가량 ÷ x증가량"을 확실히 해요.',q:['중2 연립방정식 개념','중2 일차함수 기울기']},
 {g:'중3',c:'var(--mint)',title:'중3 · 제곱근과 이차',units:['제곱근과 실수','다항식의 곱셈과 인수분해','이차방정식','이차함수','삼각비','원의 성질','통계'],
  tip:'중2의 전개(곱셈공식)가 인수분해와 이차방정식으로 이어져요. 곱셈공식을 거꾸로 쓰는 것이 인수분해예요.',q:['중3 제곱근 개념','중3 인수분해 공식','중3 이차방정식 풀이']}
];
const APPU={'초6':{'분수의 덧셈·뺄셈':'frac','분수·소수의 곱셈과 나눗셈':'dec','비례식과 비례배분':'ratio'},'중1':{'소인수분해':'gcd','정수와 유리수':'iadd','문자와 식':'lin','일차방정식':'eq1','좌표평면과 그래프':'prop'},'중2':{'식의 계산(지수법칙)':'exp','일차부등식':'ineq','연립일차방정식':'sys','일차함수':'slope'},'중3':{'제곱근과 실수':'sqrt','다항식의 곱셈과 인수분해':'factor','이차방정식':'quad'}};
function road(){app.innerHTML=`${topBar('학습 로드맵')}
  <section class="card"><h3>루미 선생님의 추천 순서</h3><p>한 단계를 80% 이상 맞히면 다음 단계로 넘어가요. 선행학습은 빠르게보다 <b>정확하게</b>가 더 중요해요. 초록 테두리 단원은 이 앱에서 바로 연습할 수 있어요.</p></section>
  ${ROAD.map(r=>`<section class="card"><div class="stage" style="--c:${r.c}"><h3>${r.title}</h3>
   <div class="units">${r.units.map(u=>{const id=(APPU[r.g]||{})[u];return `<span class="unit ${id?(mastered(id)?'done':'app'):''}">${u}${id&&mastered(id)?' ✓':''}</span>`}).join('')}</div>
   <p>${r.tip}</p>
   <div class="links">${r.q.map(yt).join('')}</div></div></section>`).join('')}
  <section class="card"><h3>강의 고르는 방법</h3><p>위 링크는 유튜브 <b>검색 결과</b>로 연결돼요. 특정 채널을 확인하지 않고 추천하지 않으려고 검색어로 안내했어요. 무료 공식 강의로는 EBS 중학 강의도 있으니 함께 찾아보세요. 15분 이내의 개념 영상 1개를 본 뒤 여기서 10문제를 풀면 가장 효과적이에요.</p></section>`}

/* ---- 부모님 리포트 ---- */
function report(){const tn=S.total.n,acc=tn?Math.round(S.total.c/tn*100):0;
  const ms=Object.entries(S.mistakes).sort((a,b)=>b[1]-a[1]).slice(0,5);const wrong=S.history.filter(h=>!h.ok).slice(0,8);
  app.innerHTML=`${topBar('부모님 리포트')}
  <section class="stat"><div><b>${tn}</b>푼 문제</div><div><b>${acc}%</b>정답률</div><div><b>${SKILLS.filter(s=>mastered(s.id)).length}/${SKILLS.length}</b>통과 단원</div></section>
  <section class="card"><h3>단원별 실력</h3><p class="muted" style="font-size:.95rem">막대는 최근 결과에 더 큰 비중을 둔 숙련도예요. 75% 이상, 3문제 이상이면 통과.</p>
   ${SKILLS.map(s=>{const k=S.skills[s.id]||{n:0,c:0,m:0};return `<div class="skillrow"><span>${s.g} · ${s.name}</span><div class="progress"><i style="width:${Math.round(k.m*100)}%"></i></div><span>${k.c}/${k.n}</span></div>`}).join('')}</section>
  <section class="card"><h3>자주 하는 실수</h3>${ms.length?ms.map(([t,c])=>`<div class="tip"><b>${TAGS[t][0]} · ${c}번</b><br>${TAGS[t][1]}</div>`).join(''):'<p class="muted">아직 기록된 실수가 없어요.</p>'}</section>
  <section class="card"><h3>최근 틀린 문제</h3>${wrong.length?wrong.map(h=>`<div class="wrongitem"><span class="tag" style="align-self:flex-start">${SK[h.skill]?SK[h.skill].g+' · '+SK[h.skill].name:''}</span><div style="font-family:var(--display);font-size:1.2rem">${h.q}</div><p>엘리사: <b>${h.given}</b> · 정답: <b>${h.ans}</b> · ${TAGS[h.tag]?TAGS[h.tag][0]:''}</p></div>`).join(''):'<p class="muted">아직 틀린 문제가 없어요.</p>'}</section>
  <section class="card"><h3>비밀번호와 사진</h3>
   <p>${canSetPin?'엘리사에게 비밀번호를 알려 주면, 엘리사는 그 번호로 수학 교실에 들어와요. 한 번 들어온 기기는 "이 기기 잠그기"를 누르거나 비밀번호를 바꾸기 전까지 열려 있어요.':'비밀번호는 부모님만 바꿀 수 있어요.'}</p>
   <div class="row">${canSetPin?'<button class="btn pri" id="chgPin">비밀번호 바꾸기</button>':''}<button class="btn" id="lockNow">이 기기 잠그기</button></div>
   <div class="row"><button class="btn" data-photo>${photo?'사진 바꾸기':'사진 올리기'}</button>${photo?'<button class="btn ghost" id="delPhoto">사진 지우고 루미로 돌아가기</button>':''}</div>
   <input type="file" id="photoIn" accept="image/*" hidden></section>
  <section class="card"><h3>기록 지우기</h3><p class="muted">진단과 모든 기록을 처음 상태로 돌려요. 되돌릴 수 없어요.</p><div class="row" id="resetRow"><button class="btn" id="reset">기록 지우기</button></div></section>
  <p class="save" id="save"></p>`;
  const cp=document.getElementById('chgPin');if(cp)cp.onclick=()=>{pinBuf='';pinFirst=null;pinMsg='';view='setpin';render()};
  document.getElementById('lockNow').onclick=lockDevice;
  const dp=document.getElementById('delPhoto');if(dp)dp.onclick=clearPhoto;
  document.getElementById('reset').onclick=()=>{document.getElementById('resetRow').innerHTML='<span>정말 지울까요?</span><button class="btn pri" id="yes">네, 지워요</button><button class="btn" id="no">아니요</button>';
    document.getElementById('yes').onclick=()=>{S=blank();save();view='home';render()};document.getElementById('no').onclick=()=>report()}}

/* ---- 사진 / 잠금 화면 ---- */
const CAM=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>`;
function avatar(editable){const face=photo?`<img src="${photo}" alt="엘리사 사진">`:MASCOT;
  return `<div class="avatar">${face}${editable?`<button class="cam" data-photo aria-label="${photo?'사진 바꾸기':'사진 올리기'}" title="${photo?'사진 바꾸기':'사진 올리기'}">${CAM}</button><input type="file" id="photoIn" accept="image/*" hidden>`:''}</div>`}
let pinBuf='',pinFirst=null,pinMsg='',pinWrong=0,pinWait=0;
function pinPad(){return `<div class="pad pinpad" id="pinpad">${['1','2','3','4','5','6','7','8','9','⌫','0','ok'].map(k=>`<button class="${k==='ok'?'go':k==='⌫'?'op':''}" data-p="${k}" aria-label="${k==='⌫'?'지우기':k==='ok'?'확인':k}">${k==='ok'?'확인':k}</button>`).join('')}</div>`}
function pinDots(){let d='';for(let i=0;i<Math.max(4,pinBuf.length);i++)d+=`<i class="${i<pinBuf.length?'on':''}"></i>`;return `<div class="pins" aria-label="${pinBuf.length}자리 입력">${d}</div>`}
function lockCard(title,sub,extra){app.innerHTML=`<section class="qcard lockcard">${avatar(false)}<h2>${title}</h2><p class="muted">${sub}</p>${pinDots()}<p class="perr" id="perr" aria-live="polite">${pinMsg}</p>${pinPad()}${extra||''}</section>`;
  document.getElementById('pinpad').onclick=e=>{const b=e.target.closest('button');if(b)pinKey(b.dataset.p)}}
function splash(){app.innerHTML=`<section class="qcard lockcard">${avatar(false)}<h2>엘리사의 수학 교실</h2><p class="muted">루미가 준비하고 있어요…</p></section>`}
function noPin(){app.innerHTML=`<section class="qcard lockcard">${avatar(false)}<h2>아직 비밀번호가 없어요</h2><p>부모님이 이 수학 교실을 열어 비밀번호를 만들면, 그 번호로 들어올 수 있어요.</p></section>`}
function lockScreen(){lockCard('비밀번호를 입력해요','부모님께 받은 번호로 수학 교실에 들어와요.')}
function setPinScreen(){const changing=!!lockHash;
  lockCard(pinFirst===null?(changing?'새 비밀번호 만들기':'부모님 비밀번호 만들기'):'한 번 더 입력해요',
    pinFirst===null?'숫자 4~6자리로 만들어요. 만든 번호를 엘리사에게 알려 주세요.':'같은 번호를 다시 눌러 확인해요.',
    changing?'<button class="btn ghost" id="pinCancel">취소</button>':'');
  const c=document.getElementById('pinCancel');if(c)c.onclick=()=>{pinBuf='';pinFirst=null;pinMsg='';view='report';render()}}
async function pinKey(k){const g=gate();const mode=g==='lock'?'lock':(g==='setpin'||view==='setpin')?'set':null;if(!mode)return;
  if(k==='⌫'){pinBuf=pinBuf.slice(0,-1);pinMsg=''}
  else if(k!=='ok'){if(pinBuf.length<6)pinBuf+=k;pinMsg=''}
  if(k!=='ok'){render();return}
  if(pinBuf.length<4){pinMsg='숫자를 4자리 이상 눌러요.';render();return}
  if(mode==='lock'){if(Date.now()<pinWait){pinMsg='잠깐 쉬었다가 다시 해요.';render();return}
    const h=await hashPin(pinBuf);pinBuf='';
    if(h===lockHash){memUnlocked=h;lsSet(LU,h);pinWrong=0;pinMsg='';view='home';render();confetti(24)}
    else{pinWrong++;if(pinWrong>=5){pinWait=Date.now()+30000;pinWrong=0;pinMsg='5번 틀렸어요. 30초 뒤에 다시 해요.'}else pinMsg='번호가 달라요. 다시 눌러 봐요.';render();shake()}
    return}
  if(pinFirst===null){pinFirst=pinBuf;pinBuf='';pinMsg='';render();return}
  if(pinBuf!==pinFirst){pinFirst=null;pinBuf='';pinMsg='두 번호가 달라요. 처음부터 다시 만들어요.';render();shake();return}
  const changing=view==='setpin';const ok=await savePin(pinBuf);pinBuf='';pinFirst=null;pinMsg='';view=changing?'report':'home';
  render();if(!ok){const el=document.getElementById('save');if(el)el.textContent='비밀번호를 claude.ai에 저장하지 못해서 이 기기에만 적용됐어요.'}confetti(30)}
function shake(){const c=app.querySelector('.pins');if(c){c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}}
function confetti(nn){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=document.getElementById('confetti');const cols=['#ff6f4f','#ffc23c','#6c55e0','#22a88a','#ff7a8a'];
  for(let i=0;i<nn;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'vw';e.style.background=pick(cols);e.style.animationDelay=Math.random()*.4+'s';c.appendChild(e);setTimeout(()=>e.remove(),2200)}}
render();
</script>
